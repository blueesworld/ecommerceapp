<title>ECommerce Pro</title>
<style>
:root{
  --bg:#f1f1f1; --card:#ffffff; --line:#e3e3e3; --line2:#ebebeb;
  --t1:#303030; --t2:#616161; --t3:#8a8a8a;
  --green:#008060; --green-d:#006e52; --green-bg:#cdfee1; --green-ink:#0c5132;
  --yellow-bg:#ffd6a4; --yellow-ink:#5e4200;
  --gray-bg:#e3e3e3; --gray-ink:#4a4a4a;
  --blue-bg:#a4e8f2; --blue-ink:#00444f;
  --red:#d72c0d; --red-bg:#fed3d1;
  --dark:#1a1a1a;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Inter","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg)}
body{font-family:var(--font);color:var(--t1);-webkit-font-smoothing:antialiased;overflow:hidden;font-size:15px}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{border:none;background:none;cursor:pointer}
::-webkit-scrollbar{display:none}
.app{max-width:480px;margin:0 auto;height:100vh;height:100dvh;position:relative;background:var(--bg);overflow:hidden;display:flex;flex-direction:column;box-shadow:0 0 0 1px var(--line2)}

/* ---------- top bar ---------- */
.topbar{flex:none;padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 8px;display:flex;align-items:center;justify-content:space-between;background:var(--bg)}
.store-switch{display:flex;align-items:center;gap:9px;min-width:0}
.store-ico{width:30px;height:30px;border-radius:8px;background:var(--green);color:#fff;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;flex:none}
.store-name{font-weight:650;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:190px}
.store-chev{color:var(--t3);flex:none}
.top-right{display:flex;gap:6px}
.round-btn{width:36px;height:36px;border-radius:50%;background:var(--card);display:flex;align-items:center;justify-content:center;position:relative;box-shadow:0 0 0 1px var(--line2)}
.round-btn svg{width:19px;height:19px}
.round-btn .cnt{position:absolute;top:-2px;right:-2px;background:var(--red);color:#fff;font-size:10px;font-weight:700;min-width:16px;height:16px;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0 4px;border:2px solid var(--bg)}

/* ---------- content ---------- */
.scroll{position:relative;overscroll-behavior-y:contain;flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 12px calc(118px + env(safe-area-inset-bottom,0px))}
.panel{display:none}.panel.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.page-title{font-size:26px;font-weight:700;letter-spacing:-.02em;padding:6px 4px 12px}
.page-title-row{display:flex;align-items:center;justify-content:space-between;padding-right:2px}
.card{background:var(--card);border-radius:14px;box-shadow:0 0 0 1px var(--line2),0 1px 0 rgba(0,0,0,.04);margin-bottom:12px;overflow:hidden}
.card-pad{padding:14px}
.card-title{font-size:13px;font-weight:650;color:var(--t2);margin-bottom:2px}
.sec-label{font-size:13px;font-weight:650;color:var(--t2);padding:6px 4px 8px}

.sales-head{display:flex;align-items:center;justify-content:space-between}
.range-btn{display:flex;align-items:center;gap:4px;font-size:12.5px;font-weight:600;border:1px solid var(--line);border-radius:8px;padding:5px 9px;background:#fafafa}
.big-num{font-size:32px;font-weight:700;letter-spacing:-.025em;margin-top:6px;font-variant-numeric:tabular-nums}
.delta{display:inline-flex;align-items:center;gap:3px;font-size:12.5px;font-weight:650;margin-top:3px}
.delta.up{color:var(--green)}.delta.down{color:var(--red)}.delta.flat{color:var(--t3)}
.chart{margin-top:10px;height:96px;width:100%}
.chart-x{display:flex;justify-content:space-between;font-size:10.5px;color:var(--t3);margin-top:4px}
.kpi-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.kpi{background:var(--card);border-radius:14px;box-shadow:0 0 0 1px var(--line2);padding:12px 14px}
.kpi .l{font-size:12.5px;color:var(--t2);font-weight:550}
.kpi .v{font-size:21px;font-weight:700;margin-top:4px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}

.setup-bar{height:6px;background:var(--gray-bg);border-radius:3px;margin:10px 0 4px;overflow:hidden}
.setup-bar i{display:block;height:100%;background:var(--green);border-radius:3px;transition:width .4s}
.step{display:flex;align-items:center;gap:12px;padding:13px 14px;border-top:1px solid var(--line2);cursor:pointer}
.step .chk{width:22px;height:22px;border-radius:50%;border:2px dashed #b5b5b5;display:flex;align-items:center;justify-content:center;flex:none}
.step.done .chk{background:var(--green);border:none;color:#fff;border-style:solid}
.step.done .st{color:var(--t3);text-decoration:line-through}
.step .st{font-weight:600;font-size:14px}
.step .ss{font-size:12.5px;color:var(--t2);margin-top:2px}

/* lists */
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line2);cursor:pointer}
.row:first-child{border-top:none}
.row:active{background:#f6f6f6}
.thumb{width:44px;height:44px;border-radius:10px;background:#f4f4f4;border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;font-size:22px;flex:none}
.r-main{flex:1;min-width:0}
.r-title{font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r-sub{font-size:12.5px;color:var(--t2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r-end{text-align:right;flex:none}
.r-val{font-weight:650;font-size:14px;font-variant-numeric:tabular-nums}
.badges{display:flex;gap:4px;margin-top:5px;justify-content:flex-end;flex-wrap:wrap}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:8px;white-space:nowrap}
.badge::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.7}
.b-green{background:var(--green-bg);color:var(--green-ink)}
.b-yellow{background:var(--yellow-bg);color:var(--yellow-ink)}
.b-gray{background:var(--gray-bg);color:var(--gray-ink)}
.b-blue{background:var(--blue-bg);color:var(--blue-ink)}
.b-red{background:var(--red-bg);color:#8e1f0b}
.chev{color:#bdbdbd;flex:none}

.search{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:12px;padding:10px 12px;box-shadow:0 0 0 1px var(--line2);margin-bottom:10px}
.search input{flex:1;border:none;outline:none;background:none;font-size:15px}
.search svg{color:var(--t3);flex:none}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px}
.chip{flex:none;font-size:13px;font-weight:600;padding:6px 12px;border-radius:9px;background:#e9e9e9;color:var(--t1)}
.chip.on{background:var(--dark);color:#fff}

.empty{text-align:center;padding:36px 22px}
.empty .big{font-size:38px;margin-bottom:8px}
.empty h3{font-size:16px;margin-bottom:5px}
.empty p{font-size:13.5px;color:var(--t2);line-height:1.45;margin-bottom:14px}

/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:7px;font-weight:650;font-size:15px;padding:13px 16px;border-radius:12px;width:100%}
.btn-primary{background:var(--dark);color:#fff}
.btn-green{background:var(--green);color:#fff}
.btn-green:active{background:var(--green-d)}
.btn-sec{background:#fff;color:var(--t1);box-shadow:0 0 0 1px var(--line)}
.btn-danger{background:#fff;color:var(--red);box-shadow:0 0 0 1px var(--line)}
.btn-sm{width:auto;padding:8px 13px;font-size:13.5px;border-radius:10px}
.btn[disabled]{opacity:.45;pointer-events:none}
.fab{position:absolute;right:16px;bottom:calc(104px + env(safe-area-inset-bottom,0px));width:54px;height:54px;border-radius:18px;background:var(--dark);color:#fff;display:none;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(0,0,0,.28);z-index:20}
.fab.show{display:flex;animation:pop .5s cubic-bezier(.34,1.56,.64,1)}

/* forms */
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:var(--t1)}
.input,.field input,.field select{width:100%;background:#fff;border:1px solid #c9c9c9;border-radius:10px;padding:12px 13px;font-size:16px;outline:none;appearance:none;-webkit-appearance:none}
.field input:focus,.field select:focus{border-color:var(--green);box-shadow:0 0 0 2px rgba(0,128,96,.2)}
.row2{display:flex;gap:10px}.row2 .field{flex:1}
.hint{font-size:12.5px;color:var(--t2);margin-top:5px;line-height:1.4}
.emoji-pick,.swatches{display:flex;gap:8px;flex-wrap:wrap}
.emoji-pick button{width:40px;height:40px;border-radius:10px;background:#f4f4f4;border:2px solid transparent;font-size:19px}
.emoji-pick button.sel{border-color:var(--green);background:#e9f7f1}
.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-top:1px solid var(--line2)}
.toggle-row:first-child{border-top:none}
.toggle-row b{font-size:14.5px;font-weight:600;display:block}
.toggle-row span{font-size:12.5px;color:var(--t2)}
.switch{width:51px;height:31px;border-radius:16px;background:#d1d1d6;position:relative;flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.25);transition:transform .35s cubic-bezier(.34,1.56,.64,1),width .2s}
.switch.on{background:#34c759}.switch.on::after{transform:translateX(20px)}
.seg{display:flex;background:#e9e9e9;border-radius:10px;padding:2px;margin-bottom:12px}
.seg button{flex:1;padding:7px 4px;border-radius:8px;font-size:13px;font-weight:600;color:var(--t2)}
.seg button.on{background:#fff;color:var(--t1);box-shadow:0 1px 3px rgba(0,0,0,.15)}

/* liquid glass tab bar */
.tabbar{position:absolute;left:0;right:0;bottom:0;z-index:30;display:flex;align-items:center;gap:10px;padding:14px 14px calc(env(safe-area-inset-bottom,0px) + 8px);pointer-events:none;background:none}
.tb-circle,.tb-pill{pointer-events:auto;position:relative;
  background:radial-gradient(130% 150% at 12% -10%,rgba(255,255,255,.85),rgba(255,255,255,0) 52%),linear-gradient(180deg,rgba(255,255,255,.34),rgba(255,255,255,.14));
  backdrop-filter:blur(20px) saturate(210%) brightness(1.05);-webkit-backdrop-filter:blur(20px) saturate(210%) brightness(1.05);
  box-shadow:inset 0 1.5px 1px rgba(255,255,255,.95),inset 0 -1.5px 1px rgba(255,255,255,.4),inset 0 0 22px rgba(255,255,255,.28),0 10px 30px rgba(0,0,0,.16),0 2px 6px rgba(0,0,0,.08),0 0 0 .5px rgba(0,0,0,.09);
  transition:transform .35s cubic-bezier(.34,1.56,.64,1)}
.tb-circle{width:58px;height:58px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;color:#6e6e73}
.tb-circle svg{width:26px;height:26px}
.tb-circle:active{transform:scale(.9)}
.tb-pill{flex:1;height:62px;border-radius:31px;display:flex;align-items:center;justify-content:space-around;padding:0 5px;touch-action:none;user-select:none;-webkit-user-select:none}
.tb-pill.pressed{transform:scale(1.03)}
.tb-lens{position:absolute;left:0;top:4px;width:54px;height:54px;border-radius:50%;z-index:0;pointer-events:none;
  background:radial-gradient(90% 90% at 30% 15%,rgba(255,255,255,.95),rgba(255,255,255,.4)),rgba(255,255,255,.3);
  box-shadow:inset 0 1.5px 1px #fff,inset 0 -3px 8px rgba(0,0,0,.07),0 3px 12px rgba(0,0,0,.14),0 0 0 .5px rgba(0,0,0,.06);
  transition:transform .55s cubic-bezier(.34,1.35,.5,1),scale .3s cubic-bezier(.34,1.56,.64,1)}
.tb-lens.noanim{transition:none}
.tb-lens.stretch{animation:stretch .55s cubic-bezier(.34,1.35,.5,1)}
.tb-pill.pressed .tb-lens{scale:1.16}
@keyframes stretch{0%{scale:1 1}35%{scale:1.32 .9}100%{scale:1 1}}
.tb-item{position:relative;z-index:1;width:54px;height:54px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#7a7a80;transition:color .25s}
.tb-item svg{width:27px;height:27px;transition:transform .4s cubic-bezier(.34,1.56,.64,1)}
.tb-item.active{color:#111}
.tb-item.active svg{transform:scale(1.06)}
.tb-item .fillable .f{fill:none;transition:fill .25s}
.tb-item.active .fillable .f{fill:currentColor}
.tb-item.ping svg{animation:ping .8s cubic-bezier(.34,1.56,.64,1)}
@keyframes ping{0%{transform:scale(1) rotate(0)}25%{transform:scale(1.3) rotate(-14deg)}55%{transform:scale(1.2) rotate(10deg)}100%{transform:scale(1) rotate(0)}}
.tb-av{width:36px;height:36px;border-radius:50%;background:var(--green);color:#fff;font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 1px 1px rgba(255,255,255,.4)}
.tb-circle.hasav{padding:0}
/* sheets */
.overlay{position:absolute;inset:0;background:rgba(0,0,0,.4);z-index:50;opacity:0;pointer-events:none;transition:opacity .25s}
.overlay.show{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:51;background:var(--bg);border-radius:18px 18px 0 0;max-height:92%;display:flex;flex-direction:column;transform:translateY(104%);transition:transform .5s cubic-bezier(.32,.72,0,1)}
.sheet.show{transform:none}
.sheet-top{flex:none;padding:8px 16px 4px;text-align:center}
.grab{width:36px;height:5px;border-radius:3px;background:#c7c7cc;margin:0 auto 8px}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:4px 16px 10px}
.sheet-head h3{font-size:17px;font-weight:700}
.sheet-head .x{color:var(--green);font-weight:600;font-size:15px}
.sheet-body{overflow-y:auto;padding:4px 12px calc(22px + env(safe-area-inset-bottom,0px))}

/* subview */
.sub-head{display:flex;align-items:center;gap:6px;padding:4px 0 10px}
.sub-head button{display:flex;align-items:center;gap:2px;color:var(--green);font-weight:550;font-size:16px}
.sub-title{font-size:26px;font-weight:700;letter-spacing:-.02em;padding:0 4px 12px}

/* notification banner */
.banner{position:absolute;left:8px;right:8px;top:calc(env(safe-area-inset-top,0px) + 8px);z-index:100;background:rgba(246,246,246,.94);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-radius:22px;padding:12px 14px;display:flex;gap:11px;align-items:flex-start;box-shadow:0 10px 30px rgba(0,0,0,.28);transform:translateY(-160%);transition:transform .45s cubic-bezier(.2,.9,.25,1.05);cursor:pointer}
.banner.show{transform:none}
.banner .app-ico{width:38px;height:38px;border-radius:9px;background:var(--green);color:#fff;font-weight:800;font-size:17px;display:flex;align-items:center;justify-content:center;flex:none}
.banner .bt{flex:1;min-width:0}
.banner .bh{display:flex;justify-content:space-between;align-items:baseline}
.banner .bh b{font-size:14.5px;font-weight:650}
.banner .bh span{font-size:12px;color:var(--t3)}
.banner .bm{font-size:14px;line-height:1.3;margin-top:1px;color:#1c1c1e}

.toast{position:absolute;left:50%;bottom:calc(112px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);background:rgba(30,30,30,.94);color:#fff;padding:10px 16px;border-radius:12px;font-size:13.5px;font-weight:550;opacity:0;pointer-events:none;transition:all .28s;z-index:120;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* menu */
.menu-row{display:flex;align-items:center;gap:13px;padding:13px 14px;border-top:1px solid var(--line2);cursor:pointer}
.menu-row:first-child{border-top:none}
.menu-row:active{background:#f6f6f6}
.menu-row .mi{width:32px;height:32px;border-radius:8px;background:#f1f1f1;display:flex;align-items:center;justify-content:center;color:var(--t1);flex:none}
.menu-row .mi svg{width:18px;height:18px}
.menu-row b{font-size:15px;font-weight:600;display:block}
.menu-row span.s{font-size:12.5px;color:var(--t2)}
.menu-row.admin .mi{background:var(--dark);color:#fff}

/* onboarding */
.onboard{position:absolute;inset:0;z-index:200;background:#fff;display:none;flex-direction:column}
.onboard.show{display:flex}
.ob-top{flex:none;padding:calc(env(safe-area-inset-top,0px) + 14px) 20px 0;display:flex;align-items:center;justify-content:space-between;min-height:52px}
.ob-back{color:var(--green);font-weight:550;font-size:16px;display:flex;align-items:center}
.ob-dots{display:flex;gap:5px}
.ob-dots i{width:22px;height:4px;border-radius:2px;background:#e3e3e3}
.ob-dots i.on{background:var(--green)}
.ob-body{flex:1;overflow-y:auto;padding:18px 22px 20px;display:flex;flex-direction:column}
.ob-body h1{font-size:28px;font-weight:750;letter-spacing:-.025em;line-height:1.15;margin-bottom:8px}
.ob-body p.lead{font-size:15px;color:var(--t2);line-height:1.45;margin-bottom:22px}
.ob-foot{flex:none;padding:12px 22px calc(env(safe-area-inset-bottom,0px) + 18px)}
.ob-hero{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:flex-start}
.ob-logo{width:64px;height:64px;border-radius:18px;background:var(--green);color:#fff;font-weight:800;font-size:30px;display:flex;align-items:center;justify-content:center;margin-bottom:26px;box-shadow:0 10px 24px rgba(0,128,96,.35)}
.opt{display:flex;align-items:center;gap:12px;padding:14px;border:1.5px solid #dcdcdc;border-radius:14px;margin-bottom:9px;font-weight:600;cursor:pointer}
.opt.sel{border-color:var(--green);background:#f1faf6}
.opt .oe{font-size:22px}
.opt .rad{margin-left:auto;width:20px;height:20px;border-radius:50%;border:2px solid #c4c4c4;flex:none}
.opt.sel .rad{border:6px solid var(--green)}
.build{padding-top:30px}
.build-item{display:flex;align-items:center;gap:12px;padding:11px 0;font-size:15px;color:var(--t3);transition:color .3s}
.build-item.on{color:var(--t1);font-weight:600}
.build-item .bi{width:24px;height:24px;border-radius:50%;border:2px solid #d3d3d3;display:flex;align-items:center;justify-content:center;flex:none;transition:all .3s}
.build-item.on .bi{background:var(--green);border-color:var(--green);color:#fff}
.spin{width:20px;height:20px;border:3px solid #e3e3e3;border-top-color:var(--green);border-radius:50%;animation:sp .8s linear infinite;margin-right:2px}
@keyframes sp{to{transform:rotate(360deg)}}

/* admin */
.admin-badge{display:inline-flex;align-items:center;gap:5px;background:var(--dark);color:#fff;font-size:11px;font-weight:700;padding:3px 9px;border-radius:8px;letter-spacing:.03em}
.push-preview{background:#d9dce1;border-radius:16px;padding:14px;margin-bottom:12px}
.push-preview .banner{position:relative;transform:none;left:0;right:0;top:0;cursor:default}
.push-label{font-size:11.5px;font-weight:650;color:#4a4f57;margin-bottom:8px;text-transform:uppercase;letter-spacing:.05em}

/* animations */
.panel.anim>*{animation:rise .6s cubic-bezier(.2,.85,.25,1) both}
.panel.anim>*:nth-child(2){animation-delay:.05s}.panel.anim>*:nth-child(3){animation-delay:.1s}.panel.anim>*:nth-child(4){animation-delay:.15s}.panel.anim>*:nth-child(5){animation-delay:.2s}.panel.anim>*:nth-child(6){animation-delay:.25s}.panel.anim>*:nth-child(7){animation-delay:.3s}.panel.anim>*:nth-child(n+8){animation-delay:.35s}
@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.985)}to{opacity:1;transform:none}}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:none;opacity:1}}
@keyframes wipe{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
.chart.wipe{animation:wipe 1.1s cubic-bezier(.3,.7,.2,1) .2s both}
.btn{transition:transform .18s cubic-bezier(.34,1.56,.64,1),background .2s}.btn:active{transform:scale(.97)}
.chip{transition:background .2s,color .2s,transform .2s}.chip:active{transform:scale(.94)}
.overlay.show{backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.row,.menu-row,.step{transition:background .15s}
.badge{animation:fade .4s ease both}
@keyframes fade{from{opacity:0}to{opacity:1}}
/* pull to refresh */
.ptr{position:absolute;left:0;right:0;top:0;height:58px;display:flex;align-items:center;justify-content:center;pointer-events:none;opacity:0;color:#8a8a8e}
.ptr svg{width:28px;height:28px}
.ptr line{stroke:currentColor;stroke-width:2.4;stroke-linecap:round;opacity:.18;transition:opacity .12s}
.ptr.spin svg{animation:ptrspin .9s steps(12) infinite}
@keyframes ptrspin{to{transform:rotate(360deg)}}
.scroll.pulling .panel{transform:translateY(var(--pull,0px))}
.scroll.releasing .panel{transition:transform .5s cubic-bezier(.2,.9,.25,1.05)}
.scroll.releasing .ptr{transition:opacity .3s}

/* ===== v4: dark home, rounded, liquid glass ===== */
.app.home-dark{background:#000}
.topbar{padding:calc(env(safe-area-inset-top,0px) + 8px) 14px 10px;gap:10px}
.tp-avatar{width:44px;height:44px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#cb45d8,#8a2fc9);color:#fff;box-shadow:inset 0 1.5px 1px rgba(255,255,255,.45),0 4px 14px rgba(138,47,201,.38);transition:transform .25s cubic-bezier(.34,1.56,.64,1)}
.tp-avatar:active{transform:scale(.9)}
.tp-avatar svg{width:22px;height:22px}
.store-switch{flex:1;justify-content:center;gap:10px;min-width:0}
.store-ico{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,#46c8ff,#1c8dff);font-size:14px;letter-spacing:-.02em;box-shadow:inset 0 1px 1px rgba(255,255,255,.5)}
.store-name{font-size:20px;font-weight:650;letter-spacing:-.02em;max-width:150px}
.round-btn{width:44px;height:44px;background:rgba(255,255,255,.7);backdrop-filter:blur(16px) saturate(180%);-webkit-backdrop-filter:blur(16px) saturate(180%);box-shadow:inset 0 1px 1px rgba(255,255,255,.9),0 2px 10px rgba(0,0,0,.1),0 0 0 .5px rgba(0,0,0,.06)}
.round-btn svg{width:23px;height:23px}
.app.home-dark .topbar{background:#000;color:#fff}
.app.home-dark .store-name{color:#fff}
.app.home-dark .round-btn{color:#fff;background:rgba(255,255,255,.1);box-shadow:inset 0 1px 1px rgba(255,255,255,.28),0 0 0 .5px rgba(255,255,255,.1)}
.app.home-dark .round-btn .cnt{border-color:#000}
.app.home-dark .scroll{background:#000;padding:0}
.app.home-dark .ptr{color:#9a9aa0}
.hero{background:#000;color:#fff;padding:8px 0 22px}
.metrics{position:relative;display:flex;align-items:stretch;gap:4px;overflow-x:auto;padding:4px 14px 14px;scroll-snap-type:x proximity;-webkit-mask-image:linear-gradient(90deg,#000 90%,transparent);mask-image:linear-gradient(90deg,#000 90%,transparent)}
.metrics::-webkit-scrollbar{display:none}
.metric,.m-live{flex:none;text-align:left;padding:10px 15px;border-radius:24px;scroll-snap-align:start;border:1px solid transparent;color:#fff;transition:background .35s,border-color .35s,transform .3s cubic-bezier(.34,1.56,.64,1),box-shadow .35s}
.m-live{padding-left:4px;padding-right:14px}
.metric.on{background:linear-gradient(180deg,rgba(255,255,255,.17),rgba(255,255,255,.06));border-color:rgba(255,255,255,.15);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:inset 0 1px 1px rgba(255,255,255,.28),0 6px 18px rgba(0,0,0,.35)}
.metric:active{transform:scale(.95)}
.m-l{font-size:14.5px;color:#d6d6da;font-weight:500;white-space:nowrap}
.m-v{display:flex;align-items:center;gap:8px;margin-top:3px;font-size:22px;font-weight:650;letter-spacing:-.02em;color:#fff;font-variant-numeric:tabular-nums;white-space:nowrap}
.m-d{font-size:14.5px;font-weight:600;display:inline-flex;align-items:center;gap:4px;letter-spacing:0}
.m-d.up{color:#34d27b}.m-d.down{color:#ff6b5e}.m-d.flat{color:#8e8e93}
.live-ring{width:20px;height:20px;border-radius:50%;border:2.2px dotted #34d27b;position:relative;display:inline-block;animation:ptrspin 7s linear infinite}
.live-ring::after{content:"";position:absolute;inset:3.5px;border-radius:50%;background:#34d27b;animation:livepulse 1.8s ease-in-out infinite}
@keyframes livepulse{0%,100%{transform:scale(.7);opacity:.7}50%{transform:scale(1);opacity:1}}
.hero-chart{position:relative;padding:4px 14px 0;touch-action:pan-y;user-select:none;-webkit-user-select:none;cursor:crosshair}
.hero-chart svg{display:block;width:100%;height:auto;overflow:visible}
.hero-chart svg.wipe{animation:wipe 1.1s cubic-bezier(.3,.7,.2,1) both}
.hc-tip{position:absolute;top:-4px;transform:translateX(-50%);pointer-events:none;padding:8px 14px;border-radius:16px;background:rgba(58,58,64,.62);backdrop-filter:blur(16px) saturate(170%);-webkit-backdrop-filter:blur(16px) saturate(170%);border:1px solid rgba(255,255,255,.16);box-shadow:inset 0 1px 1px rgba(255,255,255,.2),0 8px 22px rgba(0,0,0,.4);color:#fff;white-space:nowrap;opacity:0;transition:opacity .15s;text-align:center;z-index:2}
.hc-tip.show{opacity:1}
.hc-tip b{display:block;font-size:16px;font-weight:650}
.hc-tip span{font-size:12px;color:#c4c4c9}
.hero-pills{display:flex;justify-content:center;gap:12px;padding:16px 14px 0}
.gpill{display:flex;align-items:center;gap:9px;height:50px;padding:0 22px;border-radius:999px;color:#fff;font-weight:600;font-size:16px;background:linear-gradient(180deg,rgba(255,255,255,.17),rgba(255,255,255,.05));border:1px solid rgba(255,255,255,.15);backdrop-filter:blur(16px) saturate(180%);-webkit-backdrop-filter:blur(16px) saturate(180%);box-shadow:inset 0 1px 1px rgba(255,255,255,.28),0 6px 16px rgba(0,0,0,.35);transition:transform .25s cubic-bezier(.34,1.56,.64,1)}
.gpill:active{transform:scale(.94)}
.gpill svg{width:22px;height:22px}
.sheet-home{background:#fff;color:#1a1a1a;border-radius:34px 34px 0 0;padding:24px 14px calc(140px + env(safe-area-inset-bottom,0px));min-height:62vh;position:relative}
.sh-greet{font-size:26px;font-weight:650;letter-spacing:-.025em;line-height:1.2;margin:0 4px 18px}
.sh-greet span{color:#7b7b80;font-weight:500}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.tile{position:relative;text-align:left;background:#fff;border-radius:26px;padding:16px 16px 18px;box-shadow:0 0 0 1px #ececec,0 8px 20px rgba(0,0,0,.05);transition:transform .25s cubic-bezier(.34,1.56,.64,1)}
.tile:active{transform:scale(.96)}
.tile .tl{font-size:14.5px;color:#55555a}
.tile .tv{font-size:22px;font-weight:650;margin-top:5px;letter-spacing:-.02em}
.tile svg{position:absolute;right:14px;bottom:16px;width:22px;height:22px;color:#6f6f74}
.sheet-home .card{border-radius:28px;box-shadow:0 0 0 1px #ececec,0 8px 20px rgba(0,0,0,.05)}
.ms-card{border-radius:30px;padding:24px 22px 26px;color:#fff;background:linear-gradient(180deg,#000 0%,#222225 52%,#909095 100%);margin-bottom:14px}
.ms-card h3{font-size:23px;font-weight:650;letter-spacing:-.02em;line-height:1.2}
.ms-card p{margin-top:10px;font-size:16.5px;line-height:1.4;color:rgba(255,255,255,.62)}
.panel.anim>.sheet-home{animation:none}
.panel.anim .sheet-home>*{animation:rise .6s cubic-bezier(.2,.85,.25,1) both}
.panel.anim .sheet-home>*:nth-child(1){animation-delay:.12s}.panel.anim .sheet-home>*:nth-child(2){animation-delay:.18s}.panel.anim .sheet-home>*:nth-child(3){animation-delay:.24s}.panel.anim .sheet-home>*:nth-child(4){animation-delay:.3s}.panel.anim .sheet-home>*:nth-child(n+5){animation-delay:.36s}

/* rounder everything */
.btn,.btn-sm{border-radius:999px}
.btn-green{background:linear-gradient(180deg,#12a47e,#008060);box-shadow:inset 0 1px 1px rgba(255,255,255,.38),0 8px 20px rgba(0,128,96,.3)}
.btn-primary{background:linear-gradient(180deg,#2a2a2d,#111);box-shadow:inset 0 1px 1px rgba(255,255,255,.25),0 8px 20px rgba(0,0,0,.25)}
.btn-sec,.btn-danger{background:rgba(255,255,255,.72);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:inset 0 1px 1px rgba(255,255,255,.9),0 0 0 1px rgba(0,0,0,.09),0 4px 12px rgba(0,0,0,.05)}
.chip{border-radius:999px;padding:8px 16px;background:rgba(0,0,0,.07)}
.chip.on{background:linear-gradient(180deg,#2c2c2f,#111);color:#fff;box-shadow:inset 0 1px 1px rgba(255,255,255,.25)}
.badge{border-radius:999px;padding:3px 10px}
.range-btn{border-radius:999px}
.card{border-radius:24px}
.kpi{border-radius:24px}
.input,.field input,.field select{border-radius:16px}
.search{border-radius:999px;padding:12px 18px;background:rgba(255,255,255,.8);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.opt{border-radius:22px}
.seg{border-radius:999px}.seg button{border-radius:999px}
.thumb{border-radius:15px}
.emoji-pick button{border-radius:15px}
.toggle-row,.menu-row{border-radius:0}
.sheet{border-radius:32px 32px 0 0;background:rgba(243,243,246,.82);backdrop-filter:blur(36px) saturate(200%);-webkit-backdrop-filter:blur(36px) saturate(200%);box-shadow:inset 0 1.5px 1px rgba(255,255,255,.95),0 -12px 44px rgba(0,0,0,.2)}
.sheet .card{background:rgba(255,255,255,.8)}
.toast{border-radius:999px;background:rgba(32,32,36,.72);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);border:1px solid rgba(255,255,255,.14);box-shadow:inset 0 1px 1px rgba(255,255,255,.2),0 10px 28px rgba(0,0,0,.3)}
.fab{width:58px;height:58px;border-radius:50%;background:linear-gradient(180deg,rgba(52,52,56,.9),rgba(12,12,14,.9));backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:inset 0 1.5px 1px rgba(255,255,255,.35),0 12px 28px rgba(0,0,0,.32)}
.banner{border-radius:28px;background:rgba(245,245,248,.72);backdrop-filter:blur(30px) saturate(200%);-webkit-backdrop-filter:blur(30px) saturate(200%);box-shadow:inset 0 1px 1px rgba(255,255,255,.9),0 14px 38px rgba(0,0,0,.3)}
.banner .app-ico{border-radius:11px}
.ob-body .opt{border-radius:22px}
</style>
</head>

<div class="app" id="app">

<script>

function askNotif(cb){
  if(!notifSupported()){if(cb)cb("unsupported");return}

    const r=Notification.requestPermission(p=>{if(cb)cb(p)});

/* ---------- audio ---------- */
let actx;
function chime(){
  if(!S.admin.sound)return;
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    const t=actx.currentTime;
    [[880,0],[1318.5,0.14],[1760,0.28]].forEach(([f,o])=>{
      const os=actx.createOscillator(),g=actx.createGain();
      os.type="sine";os.frequency.value=f;os.connect(g);g.connect(actx.destination);
      g.gain.setValueAtTime(0,t+o);g.gain.linearRampToValueAtTime(.22,t+o+.01);g.gain.exponentialRampToValueAtTime(.0001,t+o+.6);
      os.start(t+o);os.stop(t+o+.65);
    });
  }catch(e){}
  try{if(navigator.vibrate)navigator.vibrate([30,40,30])}catch(e){}
}

  if(!animate){lens.classList.add("noanim")}

}

  const f=o.fulfilled?'<span class="badge b-gray">Versendet</span>':'<span class="badge b-yellow">Nicht versendet</span>';

function ordersInRange(days){
  const start=new Date();start.setHours(0,0,0,0);start.setDate(start.getDate()-(days-1));
  return S.orders.filter(o=>new Date(o.date)>=start);
}
function dailySeries(days){
  const out=[];const now=new Date();
  for(let i=days-1;i>=0;i--){const d=new Date(now);d.setDate(d.getDate()-i);const k=dkey(d);
    out.push({d,v:S.orders.filter(o=>dkey(o.date)===k).reduce((s,o)=>s+o.total,0)})}
  return out;
}
function hourlySeries(){
  const out=[];const now=new Date();const k=dkey(now);
  for(let h=0;h<=now.getHours();h++)out.push({h,v:S.orders.filter(o=>dkey(o.date)===k&&new Date(o.date).getHours()===h).reduce((s,o)=>s+o.total,0)});

let HC=null;

function daySeries(days,offset){
  const out=[];const base=new Date();base.setHours(12,0,0,0);
  for(let i=days-1;i>=0;i--){
    const d=new Date(base);d.setDate(d.getDate()-i-offset);
    const k=dkey(d);
    const os=S.orders.filter(o=>dkey(o.date)===k);
    const sales=os.reduce((t,o)=>t+o.total,0);
    const ses=(S.sessions&&S.sessions[k])||0;
    out.push({d,sales,orders:os.length,sessions:ses,conv:ses>0?Math.min(100,os.length/ses*100):0,aov:os.length?sales/os.length:0});
  }
  return out;
}
function agg(ser){
  const sales=ser.reduce((t,x)=>t+x.sales,0),orders=ser.reduce((t,x)=>t+x.orders,0),sessions=ser.reduce((t,x)=>t+x.sessions,0);
  return{sales,orders,sessions,conv:sessions?Math.min(100,orders/sessions*100):0,aov:orders?sales/orders:0};
}
function fmtMetric(k,v,short){
  if(k==="sales"||k==="aov")return fmt(v,short?0:2);
  if(k==="conv")return v.toFixed(1).replace(".",",")+"%";
  return Math.round(v).toLocaleString("de-DE");
}
function fmtTick(k,v){

  if(v>=1000)return (Math.round(v/100)/10).toString().replace(".",",")+"K";
  return (Math.round(v*10)/10).toString().replace(".",",");
}
function deltaOf(cur,prev){
  if(prev>0){
    const pc=(cur-prev)/prev*100,ab=Math.abs(pc);
    const t=ab>=1000?Math.round(pc/1000)+"K":(Math.round(pc*10)/10).toString().replace(".",",");
    return{cls:pc>0.05?"up":pc<-0.05?"down":"flat",txt:(pc>0?"+":"")+t+"%"};
  }
  if(cur>0)return{cls:"up",txt:"Neu"};
  return{cls:"flat",txt:"–"};
}
function niceMax(v){
  if(v<=0)return 4;
  const e=Math.pow(10,Math.floor(Math.log10(v)));
  const c=[1,1.2,1.6,2,2.4,3,4,5,6,8,10];
  for(const m of c){if(m*e>=v*1.08)return m*e}
  return 10*e;
}
function smoothPath(pts,lo,hi){
  if(pts.length<2)return pts.length?"M"+pts[0][0]+" "+pts[0][1]:"";
  const f=v=>v.toFixed(1);let d="M"+f(pts[0][0])+" "+f(pts[0][1]);
  for(let i=0;i<pts.length-1;i++){
    const p0=pts[i-1]||pts[i],p1=pts[i],p2=pts[i+1],p3=pts[i+2]||p2,t=.17;
    const c1y=Math.max(lo,Math.min(hi,p1[1]+(p2[1]-p0[1])*t)),c2y=Math.max(lo,Math.min(hi,p2[1]-(p3[1]-p1[1])*t));
    d+=" C"+f(p1[0]+(p2[0]-p0[0])*t)+" "+f(c1y)+" "+f(p2[0]-(p3[0]-p1[0])*t)+" "+f(c2y)+" "+f(p2[0])+" "+f(p2[1]);
  }
  return d;
}
function heroChartSvg(animate){
  const k=V.metric,hd=HC.hd;
  const vals=hd.cur.map(x=>x[k]),pv=hd.prev.map(x=>x[k]);
  const W=360,H=210,L=34,R=8,T=12,B=26,pw=W-L-R,ph=H-T-B;
  const mx=niceMax(Math.max(...vals,...pv,0));
  const n=vals.length;
  const X=i=>L+i/(n-1)*pw,Y=v=>T+ph-Math.min(1,v/mx)*ph;
  const pts=vals.map((v,i)=>[X(i),Y(v)]),ppts=pv.map((v,i)=>[X(i),Y(v)]);
  HC.geo={W,H,L,T,pw,ph,n,pts,vals,k};
  const grid=[0,mx/2,mx].map(t=>`<line x1="${L}" x2="${W-R}" y1="${Y(t).toFixed(1)}" y2="${Y(t).toFixed(1)}" stroke="rgba(255,255,255,.2)" stroke-width="1"/><text x="${L-9}" y="${(Y(t)+4).toFixed(1)}" text-anchor="end" fill="#a3a3a9" font-size="11.5">${fmtTick(k,t)}</text>`).join("");
  const xi=[0,Math.floor((n-1)/3),Math.floor(2*(n-1)/3)];
  const xl=xi.map((i,j)=>`<text x="${X(i).toFixed(1)}" y="${H-6}" text-anchor="${j===0?"start":"middle"}" fill="#d0d0d4" font-size="12">${hd.cur[i].d.toLocaleDateString("de-DE",{day:"numeric",month:"short"})}</text>`).join("");
  const lo=T,hi=T+ph;
  const solid=smoothPath(pts.slice(0,n-1),lo,hi),tail=smoothPath(pts.slice(n-2),lo,hi),prevP=smoothPath(ppts,lo,hi);
  return `<svg viewBox="0 0 ${W} ${H}" class="${animate?"wipe":""}">${grid}
   <path d="${prevP}" fill="none" stroke="#7a7a80" stroke-width="2.2" stroke-dasharray="0.1 6" stroke-linecap="round"/>
   <path d="${solid}" fill="none" stroke="#2aa7ff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
   <path d="${tail}" fill="none" stroke="#2aa7ff" stroke-width="2.8" stroke-dasharray="0.1 6" stroke-linecap="round"/>
   ${xl}
   <g id="hcScrub" style="opacity:0"><line id="hcLine" y1="${T}" y2="${T+ph}" stroke="rgba(255,255,255,.5)" stroke-width="1"/><circle id="hcDot" r="5.5" fill="#2aa7ff" stroke="#000" stroke-width="2.2"/></g></svg>`;
}

function bindScrub(){
  const w=$("heroChart");let down=false;
  const upd=e=>{
    const g=HC.geo,svg=w.querySelector("svg");if(!svg)return;
    const r=svg.getBoundingClientRect();
    const x=(e.clientX-r.left)/r.width*g.W;
    let i=Math.round((x-g.L)/g.pw*(g.n-1));i=Math.max(0,Math.min(g.n-1,i));
    if(HC.idx!==i){HC.idx=i;try{navigator.vibrate&&navigator.vibrate(3)}catch(_){}}
    const pt=g.pts[i];
    $("hcLine").setAttribute("x1",pt[0]);$("hcLine").setAttribute("x2",pt[0]);
    $("hcDot").setAttribute("cx",pt[0]);$("hcDot").setAttribute("cy",pt[1]);
    $("hcScrub").style.opacity=1;
    const tip=$("hcTip"),d=HC.hd.cur[i].d;
    tip.innerHTML=`<b>${fmtMetric(g.k,g.vals[i])}</b><span>${d.toLocaleDateString("de-DE",{weekday:"short",day:"numeric",month:"short"})}</span>`;
    const left=pt[0]/g.W*r.width+(r.left-w.getBoundingClientRect().left);
    tip.style.left=Math.max(62,Math.min(w.clientWidth-62,left))+"px";tip.classList.add("show");
  };
  w.addEventListener("pointerdown",e=>{down=true;try{w.setPointerCapture(e.pointerId)}catch(_){}upd(e)});
  w.addEventListener("pointermove",e=>{if(down)upd(e)});
  const end=()=>{down=false;HC.idx=-1;const sg=$("hcScrub");if(sg)sg.style.opacity=0;$("hcTip").classList.remove("show")};
  w.addEventListener("pointerup",end);w.addEventListener("pointercancel",end);
}

function rProducts(){

    if(V.pq&&!p.name.toLowerCase().includes(V.pq.toLowerCase()))return false;
    if(V.pf==="active")return p.active;if(V.pf==="draft")return!p.active;if(V.pf==="low")return p.stock<=5;return true});
  const empty=!S.products.length;
  $("tab-products").innerHTML=`
    <div class="page-title">Produkte</div>
    ${empty?"":`<div class="search"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg><input id="pq" placeholder="Produkte durchsuchen" value="${esc(V.pq)}"></div>
    <div class="chips">${[["all","Alle"],["active","Aktiv"],["draft","Entwurf"],["low","Wenig Bestand"]].map(c=>`<button class="chip ${V.pf===c[0]?"on":""}" data-f="${c[0]}">${c[1]}</button>`).join("")}</div>`}

  const a=$("addP");if(a)a.onclick=()=>openProductSheet();
  const s=$("addSample");if(s)s.onclick=()=>{SAMPLE.forEach(x=>S.products.push(Object.assign({id:uid(),active:true},x)));save();rProducts();toast("6 Beispielprodukte hinzugefügt")};

function openProductSheet(id){
  const p=id?S.products.find(x=>x.id===id):null;

/* ---------- ADMIN PANEL ---------- */
function randomCustomer(){const f=rnd(FIRST),l=rnd(LAST);return{name:f+" "+l.charAt(0)+".",full:f+" "+l,email:(f+"."+l).toLowerCase().replace(/ü/g,"ue").replace(/ö/g,"oe").replace(/ä/g,"ae")+"@mail.de",city:rnd(CITIES)}}
function makeOrder(o){
  const sub=o.items.reduce((s,i)=>s+i.price*i.qty,0);
  const total=o.percent?sub*(1-o.percent/100):sub;
  S.orderSeq++;
  const ord={id:uid(),no:S.orderSeq,customer:o.customer,email:o.email,city:o.city,items:o.items.map(i=>({pid:i.pid,name:i.name,emoji:i.emoji,price:i.price,qty:i.qty})),total,paid:o.paid,fulfilled:false,date:o.date||new Date().toISOString(),source:o.source||"Online-Shop"};
  S.orders.push(ord);
  if(!o.noStock)o.items.forEach(i=>{const p=S.products.find(x=>x.id===i.pid);if(p)p.stock=Math.max(0,p.stock-i.qty)});
  {const n=rint(8,26);S.visitors+=n;S.sessions=S.sessions||{};const k=dkey(ord.date);S.sessions[k]=(S.sessions[k]||0)+n}
  save();return ord;
}
function notifyOrder(o){
  const lead=o.items[0];
  const rest=o.items.length>1?` +${o.items.length-1} weitere`:"";
  const title=`Neue Bestellung #${o.no}`;
  const msg=`${fmt(o.total)} von ${o.customer} · ${lead.qty}× ${lead.name}${rest}`;
  S.notifications.unshift({id:uid(),title:`${S.settings.shopName}: ${title}`,msg,date:o.date,read:false,orderId:o.id});
  S.notifications=S.notifications.slice(0,100);save();
  if(S.admin.banner&&!document.hidden)showBanner(`${S.settings.shopName}: ${title}`,msg,o.id);
  if(document.hidden||!S.admin.banner)sysNotify(`${S.settings.shopName}: ${title}`,msg,o.id);
  if(S.admin.ntfy)ntfySend(`${S.settings.shopName}: ${title}`,msg).then(ok=>{if(!ok)toast("Push konnte nicht gesendet werden")});
  chime();

function buildSimOrder(){
  const A=S.admin;
  const cu=A.customer.trim()?{name:A.customer.trim(),email:A.customer.trim().toLowerCase().replace(/\s+/g,".")+"@mail.de",city:rnd(CITIES)}:randomCustomer();
  let items=[];
  const act=S.products.filter(p=>p.active);
  if(A.mode==="custom"||!act.length){
    const price=parseFloat(A.customPrice)||rint(19,189);
    items=[{pid:null,name:A.customName.trim()||"Eigener Artikel",emoji:"📦",price,qty:Math.max(1,A.qty)}];
  }else if(A.mode==="pick"){
    const p=S.products.find(x=>x.id===A.productId)||act[0];
    items=[{pid:p.id,name:p.name,emoji:p.emoji,price:p.price,qty:Math.max(1,A.qty)}];
  }else{
    const n=rint(1,Math.min(3,act.length));const pool=[...act].sort(()=>Math.random()-.5).slice(0,n);
    items=pool.map(p=>({pid:p.id,name:p.name,emoji:p.emoji,price:p.price,qty:rint(1,2)}));
  }
  return makeOrder({customer:cu.name,email:cu.email,city:cu.city,items,paid:A.paid,source:"Online-Shop"});
}
function fire(n){
  for(let i=0;i<n;i++)setTimeout(()=>{const o=buildSimOrder();notifyOrder(o)},i*1800);
}
function startAuto(){

}

/* ---------- pull to refresh ---------- */
(function(){
  const sc=$("scroll"),pe=$("ptr"),sp=pe.querySelectorAll("line");
  const TH=64;let y0=0,pull=0,track=false,pulling=false,busy=false,armed=false;
  const setSp=p=>{const n=Math.round(Math.min(1,p)*12);sp.forEach((l,i)=>l.style.opacity=i<n?1:.18)};
  const apply=px=>{sc.style.setProperty("--pull",px+"px");pe.style.opacity=Math.min(1,px/34)};
  let x0=0;
  function start(y,x){if(busy||sc.scrollTop>0)return;y0=y;x0=x||0;track=true;pulling=false;armed=false;pull=0}
  function move(y,e,x){
    if(!track)return;const dy=y-y0;
    if(!pulling&&x!=null&&Math.abs(x-x0)>Math.abs(dy)&&Math.abs(x-x0)>8){track=false;return}
    if(dy<=0&&!pulling)return;
    if(sc.scrollTop>0&&!pulling){track=false;return}
    if(e&&e.cancelable)e.preventDefault();
    if(!pulling){pulling=true;sc.classList.remove("releasing");sc.classList.add("pulling")}
    pull=Math.max(0,130*(1-Math.exp(-dy/230)));
    apply(pull);setSp(pull/TH);
    if(pull>=TH&&!armed){armed=true;try{navigator.vibrate&&navigator.vibrate(14)}catch(_){}}
    if(pull<TH)armed=false;
  }
  function end(){
    if(!track)return;track=false;if(!pulling)return;pulling=false;
    sc.classList.add("releasing");
    if(pull>=TH){
      busy=true;pe.classList.add("spin");apply(58);
      sp.forEach((l,i)=>l.style.opacity=.18+.82*(i/11));
      setTimeout(()=>{
        doRefresh();apply(0);
        setTimeout(()=>{pe.classList.remove("spin");sc.classList.remove("pulling","releasing");busy=false;pull=0},520);
      },1000);
    }else{
      apply(0);setTimeout(()=>{if(!busy)sc.classList.remove("pulling","releasing")},520);
    }
  }
  sc.addEventListener("touchstart",e=>start(e.touches[0].clientY,e.touches[0].clientX),{passive:true});
  sc.addEventListener("touchmove",e=>move(e.touches[0].clientY,e,e.touches[0].clientX),{passive:false});
  sc.addEventListener("touchend",end);sc.addEventListener("touchcancel",end);
  sc.addEventListener("mousedown",e=>start(e.clientY));
  window.addEventListener("mousemove",e=>{if(track&&e.buttons)move(e.clientY,e)});
  window.addEventListener("mouseup",end);
})();
