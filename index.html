<title>ECommerce Pro</title>
<style>
:root{
  --bg:#f1f1f1; --card:#ffffff; --line:#e3e3e3; --line2:#ebebeb;
  --t1:#303030; --t2:#616161; --t3:#8a8a8a;
  --green:#008060; --green-d:#006e52; --green-bg:#cdfee1; --green-ink:#0c5132;
  --yellow-bg:#ffd6a4; --yellow-ink:#5e4200;
  --gray-bg:#e3e3e3; --gray-ink:#4a4a4a;
  --blue-bg:#a4e8f2; --blue-ink:#00444f;
  --red:#d72c0d; --red-bg:#fed3d1;
  --dark:#1a1a1a;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Inter","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg)}
body{font-family:var(--font);color:var(--t1);-webkit-font-smoothing:antialiased;overflow:hidden;font-size:15px}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{border:none;background:none;cursor:pointer}
::-webkit-scrollbar{display:none}
.app{max-width:480px;margin:0 auto;height:100vh;height:100dvh;position:relative;background:var(--bg);overflow:hidden;display:flex;flex-direction:column;box-shadow:0 0 0 1px var(--line2)}

/* ---------- top bar ---------- */
.topbar{flex:none;padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 8px;display:flex;align-items:center;justify-content:space-between;background:var(--bg)}
.store-switch{display:flex;align-items:center;gap:9px;min-width:0}
.store-ico{width:30px;height:30px;border-radius:8px;background:var(--green);color:#fff;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;flex:none}
.store-name{font-weight:650;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:190px}
.store-chev{color:var(--t3);flex:none}
.top-right{display:flex;gap:6px}
.round-btn{width:36px;height:36px;border-radius:50%;background:var(--card);display:flex;align-items:center;justify-content:center;position:relative;box-shadow:0 0 0 1px var(--line2)}
.round-btn svg{width:19px;height:19px}
.round-btn .cnt{position:absolute;top:-2px;right:-2px;background:var(--red);color:#fff;font-size:10px;font-weight:700;min-width:16px;height:16px;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0 4px;border:2px solid var(--bg)}

/* ---------- content ---------- */
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 12px calc(118px + env(safe-area-inset-bottom,0px))}
.panel{display:none}.panel.active{display:block;animation:fade .18s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.page-title{font-size:26px;font-weight:700;letter-spacing:-.02em;padding:6px 4px 12px}
.page-title-row{display:flex;align-items:center;justify-content:space-between;padding-right:2px}
.card{background:var(--card);border-radius:14px;box-shadow:0 0 0 1px var(--line2),0 1px 0 rgba(0,0,0,.04);margin-bottom:12px;overflow:hidden}
.card-pad{padding:14px}
.card-title{font-size:13px;font-weight:650;color:var(--t2);margin-bottom:2px}
.sec-label{font-size:13px;font-weight:650;color:var(--t2);padding:6px 4px 8px}

.sales-head{display:flex;align-items:center;justify-content:space-between}
.range-btn{display:flex;align-items:center;gap:4px;font-size:12.5px;font-weight:600;border:1px solid var(--line);border-radius:8px;padding:5px 9px;background:#fafafa}
.big-num{font-size:32px;font-weight:700;letter-spacing:-.025em;margin-top:6px;font-variant-numeric:tabular-nums}
.delta{display:inline-flex;align-items:center;gap:3px;font-size:12.5px;font-weight:650;margin-top:3px}
.delta.up{color:var(--green)}.delta.down{color:var(--red)}.delta.flat{color:var(--t3)}
.chart{margin-top:10px;height:96px;width:100%}
.chart-x{display:flex;justify-content:space-between;font-size:10.5px;color:var(--t3);margin-top:4px}
.kpi-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.kpi{background:var(--card);border-radius:14px;box-shadow:0 0 0 1px var(--line2);padding:12px 14px}
.kpi .l{font-size:12.5px;color:var(--t2);font-weight:550}
.kpi .v{font-size:21px;font-weight:700;margin-top:4px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}

.setup-bar{height:6px;background:var(--gray-bg);border-radius:3px;margin:10px 0 4px;overflow:hidden}
.setup-bar i{display:block;height:100%;background:var(--green);border-radius:3px;transition:width .4s}
.step{display:flex;align-items:center;gap:12px;padding:13px 14px;border-top:1px solid var(--line2);cursor:pointer}
.step .chk{width:22px;height:22px;border-radius:50%;border:2px dashed #b5b5b5;display:flex;align-items:center;justify-content:center;flex:none}
.step.done .chk{background:var(--green);border:none;color:#fff;border-style:solid}
.step.done .st{color:var(--t3);text-decoration:line-through}
.step .st{font-weight:600;font-size:14px}
.step .ss{font-size:12.5px;color:var(--t2);margin-top:2px}

/* lists */
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line2);cursor:pointer}
.row:first-child{border-top:none}
.row:active{background:#f6f6f6}
.thumb{width:44px;height:44px;border-radius:10px;background:#f4f4f4;border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;font-size:22px;flex:none}
.r-main{flex:1;min-width:0}
.r-title{font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r-sub{font-size:12.5px;color:var(--t2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r-end{text-align:right;flex:none}
.r-val{font-weight:650;font-size:14px;font-variant-numeric:tabular-nums}
.badges{display:flex;gap:4px;margin-top:5px;justify-content:flex-end;flex-wrap:wrap}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:8px;white-space:nowrap}
.badge::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.7}
.b-green{background:var(--green-bg);color:var(--green-ink)}
.b-yellow{background:var(--yellow-bg);color:var(--yellow-ink)}
.b-gray{background:var(--gray-bg);color:var(--gray-ink)}
.b-blue{background:var(--blue-bg);color:var(--blue-ink)}
.b-red{background:var(--red-bg);color:#8e1f0b}
.chev{color:#bdbdbd;flex:none}

.search{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:12px;padding:10px 12px;box-shadow:0 0 0 1px var(--line2);margin-bottom:10px}
.search input{flex:1;border:none;outline:none;background:none;font-size:15px}
.search svg{color:var(--t3);flex:none}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px}
.chip{flex:none;font-size:13px;font-weight:600;padding:6px 12px;border-radius:9px;background:#e9e9e9;color:var(--t1)}
.chip.on{background:var(--dark);color:#fff}

.empty{text-align:center;padding:36px 22px}
.empty .big{font-size:38px;margin-bottom:8px}
.empty h3{font-size:16px;margin-bottom:5px}
.empty p{font-size:13.5px;color:var(--t2);line-height:1.45;margin-bottom:14px}

/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:7px;font-weight:650;font-size:15px;padding:13px 16px;border-radius:12px;width:100%}
.btn-primary{background:var(--dark);color:#fff}
.btn-green{background:var(--green);color:#fff}
.btn-green:active{background:var(--green-d)}
.btn-sec{background:#fff;color:var(--t1);box-shadow:0 0 0 1px var(--line)}
.btn-danger{background:#fff;color:var(--red);box-shadow:0 0 0 1px var(--line)}
.btn-sm{width:auto;padding:8px 13px;font-size:13.5px;border-radius:10px}
.btn[disabled]{opacity:.45;pointer-events:none}
.fab{position:absolute;right:16px;bottom:calc(104px + env(safe-area-inset-bottom,0px));width:54px;height:54px;border-radius:18px;background:var(--dark);color:#fff;display:none;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(0,0,0,.28);z-index:20}
.fab.show{display:flex}

/* forms */
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:var(--t1)}
.input,.field input,.field select{width:100%;background:#fff;border:1px solid #c9c9c9;border-radius:10px;padding:12px 13px;font-size:16px;outline:none;appearance:none;-webkit-appearance:none}
.field input:focus,.field select:focus{border-color:var(--green);box-shadow:0 0 0 2px rgba(0,128,96,.2)}
.row2{display:flex;gap:10px}.row2 .field{flex:1}
.hint{font-size:12.5px;color:var(--t2);margin-top:5px;line-height:1.4}
.emoji-pick,.swatches{display:flex;gap:8px;flex-wrap:wrap}
.emoji-pick button{width:40px;height:40px;border-radius:10px;background:#f4f4f4;border:2px solid transparent;font-size:19px}
.emoji-pick button.sel{border-color:var(--green);background:#e9f7f1}
.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-top:1px solid var(--line2)}
.toggle-row:first-child{border-top:none}
.toggle-row b{font-size:14.5px;font-weight:600;display:block}
.toggle-row span{font-size:12.5px;color:var(--t2)}
.switch{width:51px;height:31px;border-radius:16px;background:#d1d1d6;position:relative;flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.25);transition:transform .2s}
.switch.on{background:#34c759}.switch.on::after{transform:translateX(20px)}
.seg{display:flex;background:#e9e9e9;border-radius:10px;padding:2px;margin-bottom:12px}
.seg button{flex:1;padding:7px 4px;border-radius:8px;font-size:13px;font-weight:600;color:var(--t2)}
.seg button.on{background:#fff;color:var(--t1);box-shadow:0 1px 3px rgba(0,0,0,.15)}

/* floating tab bar (iOS style) */
.tabbar{position:absolute;left:0;right:0;bottom:0;z-index:30;display:flex;align-items:center;gap:10px;padding:18px 14px calc(env(safe-area-inset-bottom,0px) + 8px);pointer-events:none;background:linear-gradient(to top,rgba(241,241,241,.96) 38%,rgba(241,241,241,0))}
.tb-circle,.tb-pill{pointer-events:auto;background:rgba(255,255,255,.94);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);box-shadow:0 2px 14px rgba(0,0,0,.13),0 0 0 .5px rgba(0,0,0,.06)}
.tb-circle{width:58px;height:58px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;color:#7a7a7a}
.tb-circle svg{width:26px;height:26px}
.tb-circle:active,.tb-item:active{transform:scale(.94)}
.tb-pill{flex:1;height:62px;border-radius:31px;display:flex;align-items:center;justify-content:space-around;padding:0 5px}
.tb-item{width:54px;height:54px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#8a8a8a;position:relative;transition:background .2s}
.tb-item svg{width:27px;height:27px}
.tb-item.active{background:#ececec;color:#1a1a1a}
.tb-item .fillable .f{fill:none}
.tb-item.active .fillable .f{fill:currentColor}
.tb-item .dotc{position:absolute;top:8px;right:8px;width:9px;height:9px;border-radius:50%;background:var(--red);border:2px solid #fff}
.tb-av{width:36px;height:36px;border-radius:50%;background:var(--green);color:#fff;font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center}
.tb-circle.hasav{padding:0}
/* sheets */
.overlay{position:absolute;inset:0;background:rgba(0,0,0,.4);z-index:50;opacity:0;pointer-events:none;transition:opacity .25s}
.overlay.show{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:51;background:var(--bg);border-radius:18px 18px 0 0;max-height:92%;display:flex;flex-direction:column;transform:translateY(104%);transition:transform .32s cubic-bezier(.32,.72,0,1)}
.sheet.show{transform:none}
.sheet-top{flex:none;padding:8px 16px 4px;text-align:center}
.grab{width:36px;height:5px;border-radius:3px;background:#c7c7cc;margin:0 auto 8px}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:4px 16px 10px}
.sheet-head h3{font-size:17px;font-weight:700}
.sheet-head .x{color:var(--green);font-weight:600;font-size:15px}
.sheet-body{overflow-y:auto;padding:4px 12px calc(22px + env(safe-area-inset-bottom,0px))}

/* subview */
.sub-head{display:flex;align-items:center;gap:6px;padding:4px 0 10px}
.sub-head button{display:flex;align-items:center;gap:2px;color:var(--green);font-weight:550;font-size:16px}
.sub-title{font-size:26px;font-weight:700;letter-spacing:-.02em;padding:0 4px 12px}

/* notification banner */
.banner{position:absolute;left:8px;right:8px;top:calc(env(safe-area-inset-top,0px) + 8px);z-index:100;background:rgba(246,246,246,.94);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-radius:22px;padding:12px 14px;display:flex;gap:11px;align-items:flex-start;box-shadow:0 10px 30px rgba(0,0,0,.28);transform:translateY(-160%);transition:transform .45s cubic-bezier(.2,.9,.25,1.05);cursor:pointer}
.banner.show{transform:none}
.banner .app-ico{width:38px;height:38px;border-radius:9px;background:var(--green);color:#fff;font-weight:800;font-size:17px;display:flex;align-items:center;justify-content:center;flex:none}
.banner .bt{flex:1;min-width:0}
.banner .bh{display:flex;justify-content:space-between;align-items:baseline}
.banner .bh b{font-size:14.5px;font-weight:650}
.banner .bh span{font-size:12px;color:var(--t3)}
.banner .bm{font-size:14px;line-height:1.3;margin-top:1px;color:#1c1c1e}

.toast{position:absolute;left:50%;bottom:calc(112px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);background:rgba(30,30,30,.94);color:#fff;padding:10px 16px;border-radius:12px;font-size:13.5px;font-weight:550;opacity:0;pointer-events:none;transition:all .28s;z-index:120;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* menu */
.menu-row{display:flex;align-items:center;gap:13px;padding:13px 14px;border-top:1px solid var(--line2);cursor:pointer}
.menu-row:first-child{border-top:none}
.menu-row:active{background:#f6f6f6}
.menu-row .mi{width:32px;height:32px;border-radius:8px;background:#f1f1f1;display:flex;align-items:center;justify-content:center;color:var(--t1);flex:none}
.menu-row .mi svg{width:18px;height:18px}
.menu-row b{font-size:15px;font-weight:600;display:block}
.menu-row span.s{font-size:12.5px;color:var(--t2)}
.menu-row.admin .mi{background:var(--dark);color:#fff}

/* onboarding */
.onboard{position:absolute;inset:0;z-index:200;background:#fff;display:none;flex-direction:column}
.onboard.show{display:flex}
.ob-top{flex:none;padding:calc(env(safe-area-inset-top,0px) + 14px) 20px 0;display:flex;align-items:center;justify-content:space-between;min-height:52px}
.ob-back{color:var(--green);font-weight:550;font-size:16px;display:flex;align-items:center}
.ob-dots{display:flex;gap:5px}
.ob-dots i{width:22px;height:4px;border-radius:2px;background:#e3e3e3}
.ob-dots i.on{background:var(--green)}
.ob-body{flex:1;overflow-y:auto;padding:18px 22px 20px;display:flex;flex-direction:column}
.ob-body h1{font-size:28px;font-weight:750;letter-spacing:-.025em;line-height:1.15;margin-bottom:8px}
.ob-body p.lead{font-size:15px;color:var(--t2);line-height:1.45;margin-bottom:22px}
.ob-foot{flex:none;padding:12px 22px calc(env(safe-area-inset-bottom,0px) + 18px)}
.ob-hero{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:flex-start}
.ob-logo{width:64px;height:64px;border-radius:18px;background:var(--green);color:#fff;font-weight:800;font-size:30px;display:flex;align-items:center;justify-content:center;margin-bottom:26px;box-shadow:0 10px 24px rgba(0,128,96,.35)}
.opt{display:flex;align-items:center;gap:12px;padding:14px;border:1.5px solid #dcdcdc;border-radius:14px;margin-bottom:9px;font-weight:600;cursor:pointer}
.opt.sel{border-color:var(--green);background:#f1faf6}
.opt .oe{font-size:22px}
.opt .rad{margin-left:auto;width:20px;height:20px;border-radius:50%;border:2px solid #c4c4c4;flex:none}
.opt.sel .rad{border:6px solid var(--green)}
.build{padding-top:30px}
.build-item{display:flex;align-items:center;gap:12px;padding:11px 0;font-size:15px;color:var(--t3);transition:color .3s}
.build-item.on{color:var(--t1);font-weight:600}
.build-item .bi{width:24px;height:24px;border-radius:50%;border:2px solid #d3d3d3;display:flex;align-items:center;justify-content:center;flex:none;transition:all .3s}
.build-item.on .bi{background:var(--green);border-color:var(--green);color:#fff}
.spin{width:20px;height:20px;border:3px solid #e3e3e3;border-top-color:var(--green);border-radius:50%;animation:sp .8s linear infinite;margin-right:2px}
@keyframes sp{to{transform:rotate(360deg)}}

/* admin */
.admin-badge{display:inline-flex;align-items:center;gap:5px;background:var(--dark);color:#fff;font-size:11px;font-weight:700;padding:3px 9px;border-radius:8px;letter-spacing:.03em}
.push-preview{background:#d9dce1;border-radius:16px;padding:14px;margin-bottom:12px}
.push-preview .banner{position:relative;transform:none;left:0;right:0;top:0;cursor:default}
.push-label{font-size:11.5px;font-weight:650;color:#4a4f57;margin-bottom:8px;text-transform:uppercase;letter-spacing:.05em}
</style>
</head>

  <div class="banner" id="banner"><div class="app-ico">E</div><div class="bt"><div class="bh"><b id="bnTitle">Neue Bestellung</b><span>jetzt</span></div><div class="bm" id="bnMsg"></div></div></div>

<script>

 {name:"Premium Hoodie Onyx",price:64.9,stock:38,category:"Bekleidung",emoji:"👕"},

];

const I={
 home:'<svg viewBox="0 0 24 24" class="fillable" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><path class="f" d="M3.5 10.5 12 3l8.5 7.5V20a1 1 0 0 1-1 1H15v-6H9v6H4.5a1 1 0 0 1-1-1z"/></svg>',

 customers:'<svg viewBox="0 0 24 24" class="fillable" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><circle class="f" cx="9" cy="8" r="3.6"/><path class="f" d="M2.8 20c.8-3.5 3.3-5.5 6.2-5.5s5.4 2 6.2 5.5z"/><path d="M16 4.6a3.6 3.6 0 0 1 0 6.8M18.5 14.8c1.7.8 2.8 2.5 3.2 5"/></svg>',

 chev:'<svg width="8" height="14" viewBox="0 0 8 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 1l6 6-6 6"/></svg>',
 back:'<svg width="10" height="17" viewBox="0 0 10 17" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 1.5 2 8.5l6.5 7"/></svg>',
 check:'<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg>',

 shield:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/></svg>',

 cog:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>',
 cart:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.5 3h2l2.7 12.4a2 2 0 0 0 2 1.6h8.1a2 2 0 0 0 2-1.6L21 7H6"/></svg>',
 bell:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>',
 trash:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg>'
};

/* ---------- state ---------- */
let S=load();
let V={tab:"home",menu:null,range:7,pf:"all",pq:"",of:"all",oq:"",editingId:null,emoji:EMOJIS[0]};
let auto={timer:null};
function blank(){return{onboarded:false,settings:{shopName:"",ownerName:"",email:"",industry:"",country:"DE",currency:"EUR",domain:""},products:[],orders:[],discounts:[],notifications:[],orderSeq:1000,visitors:0,setup:{theme:false,pay:false,domain:false},admin:{sound:true,banner:true,paid:true,customer:"",mode:"random",productId:"",qty:1,count:1,customName:"",customPrice:"",autoMin:6,autoMax:14}}}
function load(){try{const r=localStorage.getItem(KEY);if(r){const p=JSON.parse(r);return Object.assign(blank(),p,{admin:Object.assign(blank().admin,p.admin||{})})}}catch(e){}return blank()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

function fmt(n,dec){const d=dec==null?2:dec;return Number(n).toLocaleString("de-DE",{style:"currency",currency:S.settings.currency||"EUR",minimumFractionDigits:d,maximumFractionDigits:d})}
function dkey(d){const x=new Date(d);return x.getFullYear()+"-"+(x.getMonth()+1)+"-"+x.getDate()}
function fmtDate(d){return new Date(d).toLocaleString("de-DE",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"})}
function ago(d){const m=Math.round((Date.now()-new Date(d))/60000);if(m<1)return"gerade eben";if(m<60)return"vor "+m+" Min.";const h=Math.round(m/60);if(h<24)return"vor "+h+" Std.";return fmtDate(d)}
let tt;function toast(m){const t=$("toast");t.textContent=m;t.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("show"),1900)}

/* ---------- system notifications (PWA) ---------- */
let swReg=null;
if("serviceWorker" in navigator&&/^https?:$/.test(location.protocol)){
  navigator.serviceWorker.getRegistration().then(r=>{if(r)swReg=r}).catch(()=>{});
  navigator.serviceWorker.addEventListener("message",e=>{if(e.data&&e.data.orderId){go("orders");openOrder(e.data.orderId)}});
}
function notifSupported(){return "Notification" in window}
function notifState(){return notifSupported()?Notification.permission:"unsupported"}
function askNotif(cb){
  if(!notifSupported()){if(cb)cb("unsupported");return}
  try{
    const r=Notification.requestPermission(p=>{if(cb)cb(p)});
    if(r&&r.then)r.then(p=>{if(cb)cb(p)});
  }catch(e){if(cb)cb("denied")}
}
function sysNotify(title,msg,orderId){
  if(notifState()!=="granted")return false;
  const opts={body:msg,icon:"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAMAAAADACAIAAADdvvtQAAAByElEQVR42u3aQQkAQAhFQaMaZZtrB1kPwshLIHP8ES+leV4ggASQABJAEkACSAAJIAkgASSABJAEkAASQAJIAkgACSABJIAkgASQABJAEkACSAAJIAkgASSABJAEkAASQAJIAEkACSABJIAkgASQABJAEkACSAAJIAkgASSAvlb3DyCAAAIIIIAAAggggAACCCCAAAIIIIAAAggggAACCCCAAAIIIIAAAggggAACCCCAALoLyCYVIIAAAggggAACSAABBBBAAAEEEEACCCCAAAIIIIAAEkAAAQQQQAABBJAAskgECCCAAAIIIIAAAggggAACCCCAAAIIIIAAAggggAACCCCAAAIIIIAAsgeyBwJIAAEEEEAAAQQQQAABJIAAAggggAACCCABBBBAAAEEEEAACSCAAAIIIItEi0SAAAIIIIAAAggggAACCCCAAAIIIIAAAggggAACCCCAAAIIIIAAAggggAACCCCAAJIAEkACSABJAAkgASSABJAEkAASQAJIAkgACSABJAEkgASQAJIAEkACSABJXiCABJAAEkASQAJIAAkgCSABJIAEkASQABJAAkgCSAAJIAEkgCSABJAAEkASQNqvAeIGu/iXkF77AAAAAElFTkSuQmCC",tag:"order-"+(orderId||uid()),renotify:true,vibrate:[120,60,120],data:{orderId:orderId||null}};
  try{
    if(swReg&&swReg.showNotification){swReg.showNotification(title,opts);return true}
    new Notification(title,opts);return true;
  }catch(e){return false}
}

/* ---------- audio ---------- */
let actx;
function chime(){
  if(!S.admin.sound)return;
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    const t=actx.currentTime;
    [[880,0],[1318.5,0.14],[1760,0.28]].forEach(([f,o])=>{
      const os=actx.createOscillator(),g=actx.createGain();
      os.type="sine";os.frequency.value=f;os.connect(g);g.connect(actx.destination);
      g.gain.setValueAtTime(0,t+o);g.gain.linearRampToValueAtTime(.22,t+o+.01);g.gain.exponentialRampToValueAtTime(.0001,t+o+.6);
      os.start(t+o);os.stop(t+o+.65);
    });
  }catch(e){}
  try{if(navigator.vibrate)navigator.vibrate([30,40,30])}catch(e){}
}

/* ---------- banner ---------- */
let bnTimer,bnQueue=[],bnBusy=false,bnOrder=null;
function showBanner(title,msg,orderId){
  bnQueue.push({title,msg,orderId});if(!bnBusy)nextBanner();
}
function nextBanner(){
  const n=bnQueue.shift();if(!n){bnBusy=false;return}
  bnBusy=true;bnOrder=n.orderId;
  $("bnTitle").textContent=n.title;$("bnMsg").textContent=n.msg;
  $("banner").classList.add("show");
  clearTimeout(bnTimer);
  bnTimer=setTimeout(()=>{$("banner").classList.remove("show");setTimeout(nextBanner,450)},4200);
}
$("banner").addEventListener("click",()=>{
  $("banner").classList.remove("show");clearTimeout(bnTimer);bnBusy=false;
  if(bnOrder){go("orders");openOrder(bnOrder)}
});

/* ---------- tabs ---------- */
function buildTabbar(){
  const un=S.notifications.filter(n=>!n.read).length;
  const items=[["home",I.home,"Start"],["orders",I.orders,"Bestellungen"],["products",I.products,"Produkte"],["menu",I.menu,"Menü"]];
  const act=V.tab==="customers"?"menu":V.tab;
  const ini=(S.settings.ownerName||S.settings.shopName||"A").charAt(0).toUpperCase();
  $("tabbar").innerHTML=`<button class="tb-circle" id="tbSearch" aria-label="Suche">${I.search}</button>
  <div class="tb-pill">${items.map(t=>`<button class="tb-item ${act===t[0]?"active":""}" data-tab="${t[0]}" aria-label="${t[2]}">${t[1]}${t[0]==="orders"&&S.orders.some(o=>!o.fulfilled&&o.paid)&&false?'<i class="dotc"></i>':""}</button>`).join("")}</div>
  <button class="tb-circle hasav" id="tbProfile" aria-label="Profil"><span class="tb-av">${esc(ini)}</span></button>`;
  $("tabbar").querySelectorAll("[data-tab]").forEach(b=>b.addEventListener("click",()=>{if(V.tab===b.dataset.tab&&b.dataset.tab==="menu"){V.menu=null}go(b.dataset.tab)}));
  $("tbSearch").addEventListener("click",()=>{go("orders");setTimeout(()=>{const i=$("oq");if(i)i.focus()},60)});
  $("tbProfile").addEventListener("click",()=>{V.menu="settings";go("menu");V.menu="settings";rMenu()});
}
function go(tab){
  V.tab=tab;if(tab!=="menu")V.menu=null;
  document.querySelectorAll(".panel").forEach(p=>p.classList.remove("active"));
  $("tab-"+tab).classList.add("active");
  $("fab").classList.toggle("show",tab==="products");
  $("scroll").scrollTop=0;buildTabbar();render(tab);
}
function render(tab){
  tab=tab||V.tab;
  $("storeName").textContent=S.settings.shopName||"Mein Shop";
  $("storeIco").textContent=(S.settings.shopName||"M").charAt(0).toUpperCase();
  const un=S.notifications.filter(n=>!n.read).length;
  $("bellCnt").style.display=un?"flex":"none";$("bellCnt").textContent=un>9?"9+":un;

/* ---------- orders helpers ---------- */
function statusBadges(o){
  const p=o.paid?'<span class="badge b-gray">Bezahlt</span>':'<span class="badge b-yellow">Zahlung ausstehend</span>';
  const f=o.fulfilled?'<span class="badge b-gray">Versendet</span>':'<span class="badge b-yellow">Nicht versendet</span>';
  return p+f;
}
function ordersInRange(days){
  const start=new Date();start.setHours(0,0,0,0);start.setDate(start.getDate()-(days-1));
  return S.orders.filter(o=>new Date(o.date)>=start);
}
function dailySeries(days){
  const out=[];const now=new Date();
  for(let i=days-1;i>=0;i--){const d=new Date(now);d.setDate(d.getDate()-i);const k=dkey(d);
    out.push({d,v:S.orders.filter(o=>dkey(o.date)===k).reduce((s,o)=>s+o.total,0)})}
  return out;
}
function hourlySeries(){
  const out=[];const now=new Date();const k=dkey(now);
  for(let h=0;h<=now.getHours();h++)out.push({h,v:S.orders.filter(o=>dkey(o.date)===k&&new Date(o.date).getHours()===h).reduce((s,o)=>s+o.total,0)});
  if(out.length<2)out.unshift({h:0,v:0});
  return out;
}
function lineChart(vals){
  const W=320,H=96,pad=4;const max=Math.max(...vals,1);
  const pts=vals.map((v,i)=>[pad+(i/(vals.length-1||1))*(W-pad*2),H-8-(v/max)*(H-22)]);
  const line=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
  const area=line+` L${pts[pts.length-1][0]} ${H} L${pts[0][0]} ${H} Z`;
  const last=pts[pts.length-1];
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#008060" stop-opacity=".22"/><stop offset="1" stop-color="#008060" stop-opacity="0"/></linearGradient></defs>
  <line x1="0" y1="${H-1}" x2="${W}" y2="${H-1}" stroke="#ebebeb"/><path d="${area}" fill="url(#g)"/><path d="${line}" fill="none" stroke="#008060" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/></svg>`;
}

/* ---------- HOME ---------- */
function rHome(){
  const r=V.range;
  let cur,prev,series,labels;
  if(r===1){
    const t=ordersInRange(1);const y=new Date();y.setDate(y.getDate()-1);
    cur=t;prev=S.orders.filter(o=>dkey(o.date)===dkey(y));
    series=hourlySeries().map(x=>x.v);labels=["0:00","jetzt"];
  }else{
    cur=ordersInRange(r);
    const s=new Date();s.setHours(0,0,0,0);s.setDate(s.getDate()-(r-1));
    const ps=new Date(s);ps.setDate(ps.getDate()-r);
    prev=S.orders.filter(o=>{const d=new Date(o.date);return d>=ps&&d<s});
    const ds=dailySeries(r);series=ds.map(x=>x.v);
    labels=[ds[0].d.toLocaleDateString("de-DE",{day:"numeric",month:"short"}),"Heute"];
  }
  const total=cur.reduce((s,o)=>s+o.total,0),ptotal=prev.reduce((s,o)=>s+o.total,0);
  let dl="flat",dt="–";
  if(ptotal>0){const p=(total-ptotal)/ptotal*100;dl=p>0.05?"up":p<-0.05?"down":"flat";dt=(p>=0?"+":"")+p.toFixed(1).replace(".",",")+"%"}
  else if(total>0){dl="up";dt="Neu"}
  const visitors=Math.max(S.visitors,0);
  const conv=visitors>0?(S.orders.length/visitors*100):0;
  const aov=cur.length?total/cur.length:0;
  const rl={1:"Heute",7:"Letzte 7 Tage",30:"Letzte 30 Tage"}[r];

  const doneSteps=[S.products.length>0,S.setup.theme,S.setup.pay,S.setup.domain,S.orders.length>0];
  const nDone=doneSteps.filter(Boolean).length;
  let setup="";
  if(nDone<5){
    const steps=[
      ["Erstes Produkt hinzufügen","Lege fest, was du verkaufst","addprod"],
      ["Shop-Design anpassen","Farben, Logo und Layout","theme"],
      ["Zahlungen einrichten","Akzeptiere Karte, PayPal & mehr","pay"],
      ["Domain verbinden","Gib deinem Shop eine eigene Adresse","domain"],
      ["Erste Bestellung erhalten","Teile deinen Shop oder nutze das Admin-Panel","firstorder"]];
    setup=`<div class="card"><div class="card-pad" style="padding-bottom:12px"><div style="display:flex;justify-content:space-between;align-items:baseline"><b style="font-size:16px">Einrichtungsleitfaden</b><span style="font-size:12.5px;color:var(--t2)">${nDone} von 5 erledigt</span></div><div class="setup-bar"><i style="width:${nDone/5*100}%"></i></div></div>
    ${steps.map((s,i)=>`<div class="step ${doneSteps[i]?"done":""}" data-step="${s[2]}"><div class="chk">${doneSteps[i]?I.check:""}</div><div style="flex:1"><div class="st">${s[0]}</div><div class="ss">${s[1]}</div></div></div>`).join("")}</div>`;
  }

  const sold={};
  S.orders.forEach(o=>o.items.forEach(it=>{sold[it.name]=(sold[it.name]||0)+it.qty}));
  const top=Object.entries(sold).sort((a,b)=>b[1]-a[1]).slice(0,4);
  const recent=[...S.orders].sort((a,b)=>new Date(b.date)-new Date(a.date)).slice(0,4);

  $("tab-home").innerHTML=`
    <div class="page-title">Hallo, ${esc(S.settings.ownerName||"Händler")}</div>
    ${setup}
    <div class="card card-pad">
      <div class="sales-head"><span class="card-title">Gesamtverkäufe</span>
        <button class="range-btn" id="rangeBtn">${rl} ${I.caret}</button></div>
      <div class="big-num">${fmt(total)}</div>
      <div class="delta ${dl}">${dl==="up"?I.up:dl==="down"?I.down:""} ${dt} <span style="color:var(--t3);font-weight:500;margin-left:4px">ggü. Vorzeitraum</span></div>
      ${lineChart(series)}
      <div class="chart-x"><span>${labels[0]}</span><span>${labels[1]}</span></div>
    </div>
    <div class="kpi-grid">
      <div class="kpi"><div class="l">Bestellungen</div><div class="v">${cur.length}</div></div>
      <div class="kpi"><div class="l">Ø Bestellwert</div><div class="v">${fmt(aov,0)}</div></div>
      <div class="kpi"><div class="l">Besucher</div><div class="v">${visitors.toLocaleString("de-DE")}</div></div>
      <div class="kpi"><div class="l">Conversion-Rate</div><div class="v">${conv.toFixed(1).replace(".",",")}%</div></div>
    </div>
    <div class="sec-label">Letzte Bestellungen</div>
    <div class="card">${recent.length?recent.map(orderRow).join(""):`<div class="empty" style="padding:26px"><p style="margin:0">Noch keine Bestellungen.</p></div>`}</div>
    <div class="sec-label">Top-Produkte</div>
    <div class="card">${top.length?top.map(t=>{const p=S.products.find(x=>x.name===t[0]);return `<div class="row" style="cursor:default"><div class="thumb">${p?p.emoji:"📦"}</div><div class="r-main"><div class="r-title">${esc(t[0])}</div><div class="r-sub">${t[1]} verkauft</div></div></div>`}).join(""):`<div class="empty" style="padding:26px"><p style="margin:0">Verkaufsdaten erscheinen hier.</p></div>`}</div>
  `;
  $("rangeBtn").addEventListener("click",()=>{
    openSheet("Zeitraum",[[1,"Heute"],[7,"Letzte 7 Tage"],[30,"Letzte 30 Tage"]].map(x=>`<div class="opt ${V.range===x[0]?"sel":""}" data-r="${x[0]}">${x[1]}<span class="rad"></span></div>`).join(""));
    $("sheetBody").querySelectorAll("[data-r]").forEach(b=>b.addEventListener("click",()=>{V.range=+b.dataset.r;closeSheet();rHome()}));
  });
  $("tab-home").querySelectorAll("[data-step]").forEach(el=>el.addEventListener("click",()=>stepAction(el.dataset.step)));
  bindOrderRows($("tab-home"));
}
function stepAction(k){
  if(k==="addprod"){go("products");openProductSheet()}
  else if(k==="theme"){openSheet("Shop-Design",`<div class="card card-pad"><div class="card-title">Farbe wählen</div><div class="swatches" style="margin-top:10px">${["#008060","#1a1a1a","#5c6ac4","#c9731a","#b4238a"].map(c=>`<button class="thumb" style="background:${c};width:42px;height:42px;border-radius:50%;border:none"></button>`).join("")}</div></div><button class="btn btn-green" id="doneStep">Design speichern</button>`);$("doneStep").onclick=()=>{S.setup.theme=true;save();closeSheet();render();toast("Design gespeichert")}}
  else if(k==="pay"){openSheet("Zahlungen",`<div class="card"><div class="toggle-row"><div><b>Kredit- & Debitkarte</b><span>Visa, Mastercard, Amex</span></div><div class="switch on"></div></div><div class="toggle-row"><div><b>PayPal</b><span>Express-Checkout</span></div><div class="switch on"></div></div><div class="toggle-row"><div><b>Apple Pay</b><span>Ein-Tipp-Zahlung</span></div><div class="switch on"></div></div></div><button class="btn btn-green" id="doneStep">Zahlungen aktivieren</button>`);$("doneStep").onclick=()=>{S.setup.pay=true;save();closeSheet();render();toast("Zahlungen aktiviert")}}
  else if(k==="domain"){
    const def=(S.settings.shopName||"mein-shop").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
    openSheet("Domain",`<div class="field"><label>Shop-Adresse</label><input id="domIn" value="${esc(S.settings.domain||def)}" autocapitalize="off"><p class="hint">.ecommerce-pro.app</p></div><button class="btn btn-green" id="doneStep">Domain speichern</button>`);
    $("doneStep").onclick=()=>{S.settings.domain=$("domIn").value.trim()||def;S.setup.domain=true;save();closeSheet();render();toast("Domain gespeichert")}}
  else if(k==="firstorder"){go("menu");V.menu="admin";rMenu()}
}

/* ---------- ORDERS ---------- */
function orderRow(o){
  const items=o.items.reduce((s,i)=>s+i.qty,0);
  return `<div class="row" data-order="${o.id}"><div class="thumb" style="font-size:15px;font-weight:700;color:var(--t2)">#${String(o.no).slice(-3)}</div>
  <div class="r-main"><div class="r-title">#${o.no} · ${esc(o.customer)}</div><div class="r-sub">${items} Artikel · ${ago(o.date)}</div><div class="badges" style="justify-content:flex-start">${statusBadges(o)}</div></div>
  <div class="r-end"><div class="r-val">${fmt(o.total)}</div></div></div>`;
}
function bindOrderRows(c){c.querySelectorAll("[data-order]").forEach(el=>el.addEventListener("click",()=>openOrder(el.dataset.order)))}
function rOrders(){
  const list=[...S.orders].sort((a,b)=>new Date(b.date)-new Date(a.date)).filter(o=>{
    if(V.oq&&!(o.customer.toLowerCase().includes(V.oq.toLowerCase())||String(o.no).includes(V.oq)))return false;
    if(V.of==="unpaid")return!o.paid;
    if(V.of==="unfulfilled")return!o.fulfilled;
    if(V.of==="fulfilled")return o.fulfilled;
    return true});
  const today=ordersInRange(1);
  $("tab-orders").innerHTML=`
    <div class="page-title">Bestellungen</div>
    <div class="kpi-grid" style="margin-bottom:10px"><div class="kpi"><div class="l">Heute</div><div class="v">${today.length}</div></div><div class="kpi"><div class="l">Zu versenden</div><div class="v">${S.orders.filter(o=>!o.fulfilled).length}</div></div></div>
    <div class="search"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg><input id="oq" placeholder="Bestellungen durchsuchen" value="${esc(V.oq)}"></div>
    <div class="chips">${[["all","Alle"],["unfulfilled","Nicht versendet"],["unpaid","Unbezahlt"],["fulfilled","Versendet"]].map(c=>`<button class="chip ${V.of===c[0]?"on":""}" data-f="${c[0]}">${c[1]}</button>`).join("")}</div>
    <div class="card">${list.length?list.map(orderRow).join(""):`<div class="empty"><div class="big">🧾</div><h3>${S.orders.length?"Keine Treffer":"Noch keine Bestellungen"}</h3><p>${S.orders.length?"Passe Suche oder Filter an.":"Sobald jemand bei dir kauft, erscheint die Bestellung hier. Teste es im Admin-Panel."}</p>${S.orders.length?"":'<button class="btn btn-green btn-sm" id="toAdmin" style="margin:0 auto">Admin-Panel öffnen</button>'}</div>`}</div>`;
  const oq=$("oq");oq.addEventListener("input",e=>{V.oq=e.target.value;const pos=e.target.selectionStart;rOrders();const n=$("oq");n.focus();n.setSelectionRange(pos,pos)});
  $("tab-orders").querySelectorAll("[data-f]").forEach(b=>b.addEventListener("click",()=>{V.of=b.dataset.f;rOrders()}));
  const ta=$("toAdmin");if(ta)ta.onclick=()=>{go("menu");V.menu="admin";rMenu()};
  bindOrderRows($("tab-orders"));
}
function openOrder(id){
  const o=S.orders.find(x=>x.id===id);if(!o)return;
  const sub=o.items.reduce((s,i)=>s+i.price*i.qty,0);
  const disc=sub-o.total>0.001?sub-o.total:0;
  openSheet("Bestellung #"+o.no,`
    <div class="card card-pad"><div style="display:flex;justify-content:space-between;align-items:center"><div><b style="font-size:16px">${esc(o.customer)}</b><div class="r-sub">${fmtDate(o.date)} · ${esc(o.source||"Online-Shop")}</div></div></div><div class="badges" style="justify-content:flex-start;margin-top:10px">${statusBadges(o)}</div></div>
    <div class="card">${o.items.map(i=>`<div class="row" style="cursor:default"><div class="thumb">${i.emoji||"📦"}</div><div class="r-main"><div class="r-title">${esc(i.name)}</div><div class="r-sub">${fmt(i.price)} × ${i.qty}</div></div><div class="r-end"><div class="r-val">${fmt(i.price*i.qty)}</div></div></div>`).join("")}</div>
    <div class="card card-pad"><div class="toggle-row" style="padding:4px 0;border:none"><span>Zwischensumme</span><b style="font-weight:600">${fmt(sub)}</b></div>${disc?`<div class="toggle-row" style="padding:4px 0;border:none"><span>Rabatt</span><b style="font-weight:600">−${fmt(disc)}</b></div>`:""}<div class="toggle-row" style="padding:8px 0 0;border:none"><b>Gesamt</b><b style="font-size:17px">${fmt(o.total)}</b></div></div>
    <div class="card card-pad"><div class="card-title">Kunde</div><div style="margin-top:6px;font-size:14px;line-height:1.5">${esc(o.customer)}<br><span style="color:var(--t2)">${esc(o.email||"")}<br>${esc(o.city||"")}</span></div></div>
    ${o.paid?"":'<button class="btn btn-sec" id="mkPaid" style="margin-bottom:10px">Als bezahlt markieren</button>'}
    <button class="btn ${o.fulfilled?"btn-sec":"btn-green"}" id="mkFul">${o.fulfilled?"Versand zurücknehmen":"Als versendet markieren"}</button>`);
  const mp=$("mkPaid");if(mp)mp.onclick=()=>{o.paid=true;save();openOrder(id);render();toast("Als bezahlt markiert")};
  $("mkFul").onclick=()=>{o.fulfilled=!o.fulfilled;save();openOrder(id);render();toast(o.fulfilled?"Als versendet markiert":"Versand zurückgenommen")};
}

/* ---------- PRODUCTS ---------- */
function rProducts(){
  const list=S.products.filter(p=>{
    if(V.pq&&!p.name.toLowerCase().includes(V.pq.toLowerCase()))return false;
    if(V.pf==="active")return p.active;if(V.pf==="draft")return!p.active;if(V.pf==="low")return p.stock<=5;return true});

    <div class="page-title">Produkte</div>

function openProductSheet(id){
  const p=id?S.products.find(x=>x.id===id):null;

      <div class="row2"><div class="field"><label>Preis</label><input id="pPrice" type="number" inputmode="decimal" step="0.01" min="0" placeholder="0,00" value="${p?p.price:""}"></div><div class="field"><label>Bestand</label><input id="pStock" type="number" inputmode="numeric" min="0" placeholder="0" value="${p?p.stock:""}"></div></div>
      <div class="field"><label>Produkttyp</label><input id="pCat" placeholder="z. B. Bekleidung" value="${p?esc(p.category):""}"></div>

    </div>

/* ---------- CUSTOMERS ---------- */
function customersList(){
  const m={};
  S.orders.forEach(o=>{const c=m[o.customer]||(m[o.customer]={name:o.customer,email:o.email,city:o.city,n:0,sum:0,last:o.date});c.n++;c.sum+=o.total;if(new Date(o.date)>new Date(c.last))c.last=o.date});
  return Object.values(m).sort((a,b)=>b.sum-a.sum);
}
function rCustomers(){

      const code=$("coDisc").value.trim().toUpperCase();const d=S.discounts.find(x=>x.active&&x.code===code);

/* ---------- ADMIN PANEL ---------- */
function randomCustomer(){const f=rnd(FIRST),l=rnd(LAST);return{name:f+" "+l.charAt(0)+".",full:f+" "+l,email:(f+"."+l).toLowerCase().replace(/ü/g,"ue").replace(/ö/g,"oe").replace(/ä/g,"ae")+"@mail.de",city:rnd(CITIES)}}
function makeOrder(o){
  const sub=o.items.reduce((s,i)=>s+i.price*i.qty,0);
  const total=o.percent?sub*(1-o.percent/100):sub;
  S.orderSeq++;
  const ord={id:uid(),no:S.orderSeq,customer:o.customer,email:o.email,city:o.city,items:o.items.map(i=>({pid:i.pid,name:i.name,emoji:i.emoji,price:i.price,qty:i.qty})),total,paid:o.paid,fulfilled:false,date:o.date||new Date().toISOString(),source:o.source||"Online-Shop"};
  S.orders.push(ord);
  o.items.forEach(i=>{const p=S.products.find(x=>x.id===i.pid);if(p)p.stock=Math.max(0,p.stock-i.qty)});
  S.visitors+=rint(8,26);
  save();return ord;
}
function notifyOrder(o){
  const lead=o.items[0];
  const rest=o.items.length>1?` +${o.items.length-1} weitere`:"";
  const title=`Neue Bestellung #${o.no}`;
  const msg=`${fmt(o.total)} von ${o.customer} · ${lead.qty}× ${lead.name}${rest}`;
  S.notifications.unshift({id:uid(),title:`${S.settings.shopName}: ${title}`,msg,date:o.date,read:false,orderId:o.id});
  S.notifications=S.notifications.slice(0,100);save();
  if(S.admin.banner&&!document.hidden)showBanner(`${S.settings.shopName}: ${title}`,msg,o.id);
  if(document.hidden||!S.admin.banner)sysNotify(`${S.settings.shopName}: ${title}`,msg,o.id);
  chime();render();
}
function buildSimOrder(){
  const A=S.admin;
  const cu=A.customer.trim()?{name:A.customer.trim(),email:A.customer.trim().toLowerCase().replace(/\s+/g,".")+"@mail.de",city:rnd(CITIES)}:randomCustomer();
  let items=[];
  const act=S.products.filter(p=>p.active);
  if(A.mode==="custom"||!act.length){
    const price=parseFloat(A.customPrice)||rint(19,189);
    items=[{pid:null,name:A.customName.trim()||"Eigener Artikel",emoji:"📦",price,qty:Math.max(1,A.qty)}];
  }else if(A.mode==="pick"){
    const p=S.products.find(x=>x.id===A.productId)||act[0];
    items=[{pid:p.id,name:p.name,emoji:p.emoji,price:p.price,qty:Math.max(1,A.qty)}];
  }else{
    const n=rint(1,Math.min(3,act.length));const pool=[...act].sort(()=>Math.random()-.5).slice(0,n);
    items=pool.map(p=>({pid:p.id,name:p.name,emoji:p.emoji,price:p.price,qty:rint(1,2)}));
  }
  return makeOrder({customer:cu.name,email:cu.email,city:cu.city,items,paid:A.paid,source:"Online-Shop"});
}
function fire(n){
  for(let i=0;i<n;i++)setTimeout(()=>{const o=buildSimOrder();notifyOrder(o)},i*1800);
}
function startAuto(){
  stopAuto();
  const loop=()=>{const A=S.admin;const wait=rint(A.autoMin,Math.max(A.autoMin,A.autoMax))*1000;auto.timer=setTimeout(()=>{fire(1);loop()},wait)};
  loop();
}
function stopAuto(){clearTimeout(auto.timer);auto.timer=null}

    ${mode==="pick"?`<div class="field"><label>Produkt</label><select id="aProd">${act.map(p=>`<option value="${p.id}" ${A.productId===p.id?"selected":""}>${esc(p.name)} · ${fmt(p.price)}</option>`).join("")}</select></div>`:""}

    if(auto.timer){stopAuto();toast("Auto-Simulation gestoppt")}else{startAuto();toast("Auto-Simulation läuft")}rr();
  };
  $("aVis").onclick=()=>{S.visitors+=250;save();toast("+250 Besucher")};
  $("aClear").onclick=()=>{if(confirm("Alle Bestellungen löschen?")){S.orders=[];S.notifications=[];save();toast("Bestellungen gelöscht");render()}};
}

/* ---------- sheet ---------- */
function openSheet(title,html){$("sheetTitle").textContent=title;$("sheetBody").innerHTML=html;$("overlay").classList.add("show");$("sheet").classList.add("show");$("sheetBody").scrollTop=0}
function closeSheet(){$("overlay").classList.remove("show");$("sheet").classList.remove("show")}
$("overlay").addEventListener("click",closeSheet);$("sheetClose").addEventListener("click",closeSheet);

/* ---------- top bar actions ---------- */
$("bellBtn").addEventListener("click",()=>{V.menu="notif";go("menu");rMenu()});
$("storeSwitch").addEventListener("click",()=>{go("menu");V.menu="settings";rMenu()});
$("fab").addEventListener("click",()=>openProductSheet());

/* ---------- ONBOARDING ---------- */
let OB={step:0,data:{email:"",name:"",shop:"",industry:"",country:"DE"}};
function startOnboarding(){OB={step:0,data:{email:"",name:"",shop:"",industry:"",country:"DE"}};$("onboard").classList.add("show");renderOB()}
function renderOB(){
  const o=$("onboard"),st=OB.step,d=OB.data;
  const total=4;
  const dots=st>=1&&st<=4?`<div class="ob-dots">${[1,2,3,4].map(i=>`<i class="${i<=st?"on":""}"></i>`).join("")}</div>`:"<div></div>";
  const back=st>=1&&st<=4?`<button class="ob-back" id="obBack">${I.back}&nbsp;Zurück</button>`:"<div></div>";
  let body="",foot="";
  if(st===0){
    o.innerHTML=`<div class="ob-body"><div class="ob-hero"><div class="ob-logo">E</div><h1 style="font-size:34px">Starte dein<br>Business.</h1><p class="lead" style="margin-top:6px">Erstelle deinen Online-Shop, füge Produkte hinzu und verwalte Bestellungen – alles von deinem Handy.</p></div></div>
    <div class="ob-foot"><button class="btn btn-green" id="obNext">Kostenlos starten</button></div>`;
    $("obNext").onclick=()=>{OB.step=1;renderOB()};return;
  }
  if(st===1){
    body=`<h1>Erstelle dein Konto</h1><p class="lead">Mit deiner E-Mail-Adresse meldest du dich später in deinem Shop an.</p>
    <div class="field"><label>Dein Name</label><input id="obName" placeholder="Vor- und Nachname" value="${esc(d.name)}" autocomplete="name"></div>
    <div class="field"><label>E-Mail-Adresse</label><input id="obEmail" type="email" placeholder="du@beispiel.de" value="${esc(d.email)}" autocomplete="email"></div>
    <div class="field"><label>Passwort</label><input id="obPw" type="password" placeholder="Mindestens 6 Zeichen" autocomplete="new-password"></div>`;
    foot=`<button class="btn btn-green" id="obNext">Weiter</button>`;
  }
  if(st===2){
    body=`<h1>Wie heißt dein Shop?</h1><p class="lead">Diesen Namen sehen deine Kunden. Du kannst ihn später jederzeit ändern.</p>
    <div class="field"><label>Shop-Name</label><input id="obShop" placeholder="z. B. Abdi's Store" value="${esc(d.shop)}"></div>`;
    foot=`<button class="btn btn-green" id="obNext">Weiter</button>`;
  }
  if(st===3){
    body=`<h1>Was möchtest du verkaufen?</h1><p class="lead">Das hilft uns, deinen Shop passend vorzubereiten.</p>
    ${INDUSTRIES.map(x=>`<div class="opt ${d.industry===x[1]?"sel":""}" data-i="${esc(x[1])}"><span class="oe">${x[0]}</span>${x[1]}<span class="rad"></span></div>`).join("")}`;
    foot=`<button class="btn btn-green" id="obNext" ${d.industry?"":"disabled"}>Weiter</button>`;
  }
  if(st===4){
    body=`<h1>Wo ist dein Shop?</h1><p class="lead">Land und Währung legen fest, wie Preise angezeigt werden.</p>
    ${COUNTRIES.map(x=>`<div class="opt ${d.country===x[0]?"sel":""}" data-c="${x[0]}"><span class="oe">${{DE:"🇩🇪",AT:"🇦🇹",CH:"🇨🇭",US:"🇺🇸",GB:"🇬🇧"}[x[0]]}</span><span>${x[1]}<br><span style="font-size:12.5px;color:var(--t2);font-weight:500">${x[2]}</span></span><span class="rad"></span></div>`).join("")}`;
    foot=`<button class="btn btn-green" id="obNext">Shop erstellen</button>`;
  }
  if(st===5){
    const items=["Konto wird angelegt","Shop „"+d.shop+"“ wird erstellt","Zahlungen werden vorbereitet","Dashboard wird eingerichtet"];
    o.innerHTML=`<div class="ob-top"><div></div><div></div></div><div class="ob-body"><h1>Dein Shop wird erstellt…</h1><p class="lead">Einen Moment, wir richten alles ein.</p><div class="build" id="build">${items.map((t,i)=>`<div class="build-item" id="bi${i}"><div class="bi"><div class="spin" style="display:${i===0?"block":"none"};width:12px;height:12px;border-width:2px;margin:0"></div></div>${esc(t)}</div>`).join("")}</div></div>`;
    let i=0;
    const tick=()=>{
      if(i>0){const p=$("bi"+(i-1));p.classList.add("on");p.querySelector(".bi").innerHTML=I.check}
      if(i<items.length){const c=$("bi"+i);c.querySelector(".bi").innerHTML='<div class="spin" style="width:12px;height:12px;border-width:2px;margin:0"></div>';c.classList.add("on");c.querySelector(".bi").style.background="#fff";i++;setTimeout(tick,850)}
      else finishOB();
    };
    setTimeout(tick,300);return;
  }
  o.innerHTML=`<div class="ob-top">${back}${dots}</div><div class="ob-body">${body}</div><div class="ob-foot">${foot}</div>`;
  const bk=$("obBack");if(bk)bk.onclick=()=>{OB.step--;renderOB()};
  if(st===3)o.querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>{d.industry=b.dataset.i;renderOB()});
  if(st===4)o.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{d.country=b.dataset.c;renderOB()});
  const nx=$("obNext");
  nx.onclick=()=>{
    if(st===1){
      const n=$("obName").value.trim(),e=$("obEmail").value.trim(),p=$("obPw").value;
      if(!n){toast("Bitte Namen eingeben");return}
      if(!/^\S+@\S+\.\S+$/.test(e)){toast("Gültige E-Mail eingeben");return}
      if(p.length<6){toast("Passwort: mind. 6 Zeichen");return}
      d.name=n;d.email=e;
    }
    if(st===2){const s=$("obShop").value.trim();if(!s){toast("Bitte Shop-Namen eingeben");return}d.shop=s}
    if(st===4&&notifState()==="default")askNotif(()=>{});
    OB.step++;renderOB();
  };
}
function finishOB(){
  const d=OB.data;const c=COUNTRIES.find(x=>x[0]===d.country)||COUNTRIES[0];
  const fresh=blank();
  S=Object.assign(fresh,{onboarded:true,settings:{shopName:d.shop,ownerName:d.name.split(" ")[0],email:d.email,industry:d.industry,country:c[0],currency:c[2],domain:d.shop.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")},discounts:[{id:uid(),code:"WELCOME10",percent:10,active:true}],visitors:rint(40,120)});
  save();
  setTimeout(()=>{$("onboard").classList.remove("show");V.tab="home";V.menu=null;buildTabbar();go("home");toast("Dein Shop ist bereit 🎉")},700);
}

/* ---------- init ---------- */
buildTabbar();
if(!S.onboarded){startOnboarding()}else{go("home");try{const q=new URLSearchParams(location.search).get("order");if(q){go("orders");openOrder(q)}}catch(e){}}
document.addEventListener("visibilitychange",()=>{});
})();
</script>
</body>
</html>
